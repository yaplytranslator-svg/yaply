<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Yaply Camera — Scan & Translate</title>
<link rel="icon" href="/static/favicon.png" type="image/png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#1A8A72;--teal-s:rgba(26,138,114,0.12);--teal-m:rgba(26,138,114,0.25);
  --amber:#E8823A;--sky:#3A6BC8;
  --charcoal:#2C2B28;--green:#28B06A;
  --red:#D84C3E;--gold:#F0B429;
  --bg:#080C18;
  --surface:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.1);
  --border-s:rgba(255,255,255,0.06);
  --text:#F2F2F0;--muted:rgba(255,255,255,0.45);
}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
button{font-family:'Inter',sans-serif;}

/* ── CAMERA ── */
.cam-wrap{position:fixed;inset:0;background:#000;}
#video{width:100%;height:100%;object-fit:cover;opacity:.88;}
#canvas{display:none;}

/* ── FULL OVERLAY ── */
.overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;pointer-events:none;}

/* ── TOP BAR ── */
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:env(safe-area-inset-top,16px) 20px 14px;
  padding-top:calc(env(safe-area-inset-top,0px) + 52px);
  background:linear-gradient(to bottom,rgba(0,0,0,0.75),transparent);
  pointer-events:all;
}
.tb-left{display:flex;align-items:center;gap:8px;}
.tb-back{
  width:34px;height:34px;border-radius:10px;
  background:rgba(255,255,255,0.1);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;text-decoration:none;
}
.tb-back:hover{background:rgba(255,255,255,0.18);}
.tb-back svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;}
.tb-logo{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:#fff;}
.tb-logo span{color:var(--teal);}

.lang-selector{
  display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,0.1);border:1px solid var(--border);
  border-radius:100px;padding:7px 14px;
  pointer-events:all;cursor:pointer;transition:all .2s;
}
.lang-selector:hover{background:rgba(255,255,255,0.17);}
.lang-selector svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;flex-shrink:0;}
.lang-selector select{
  background:none;border:none;color:#fff;
  font-family:'Inter',sans-serif;font-size:.78rem;font-weight:600;
  outline:none;cursor:pointer;
}
.lang-selector select option{background:#1A2030;color:#fff;}

/* ── SCAN FRAME ── */
.scan-frame{
  flex:1;display:flex;align-items:center;
  justify-content:center;position:relative;
}
.frame-outer{position:relative;width:300px;height:200px;}

/* Corner brackets */
.corner{position:absolute;width:22px;height:22px;border-color:var(--teal);border-style:solid;}
.c-tl{top:0;left:0;border-width:2.5px 0 0 2.5px;border-radius:6px 0 0 0;}
.c-tr{top:0;right:0;border-width:2.5px 2.5px 0 0;border-radius:0 6px 0 0;}
.c-bl{bottom:0;left:0;border-width:0 0 2.5px 2.5px;border-radius:0 0 0 6px;}
.c-br{bottom:0;right:0;border-width:0 2.5px 2.5px 0;border-radius:0 0 6px 0;}
/* Corner glow */
.corner::after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);}
.c-tl::after{top:-3px;left:-3px;}
.c-tr::after{top:-3px;right:-3px;}
.c-bl::after{bottom:-3px;left:-3px;}
.c-br::after{bottom:-3px;right:-3px;}

/* Scan beam */
.scan-beam{
  position:absolute;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--teal),rgba(26,138,114,.8),var(--teal),transparent);
  box-shadow:0 0 12px var(--teal),0 0 24px rgba(26,138,114,.4);
  top:0;opacity:0;
}
.scan-beam.active{opacity:1;animation:scanBeam 1.8s ease-in-out infinite;}
@keyframes scanBeam{0%{top:0;}50%{top:calc(100% - 1.5px);}100%{top:0;}}

/* Frame pulse */
.frame-pulse{
  position:absolute;inset:-8px;
  border-radius:8px;border:1px solid rgba(26,138,114,.2);
  animation:framePulse 2s ease-in-out infinite;
}
@keyframes framePulse{0%,100%{opacity:.3;transform:scale(1);}50%{opacity:.7;transform:scale(1.01);}}

.frame-hint{
  position:absolute;bottom:-44px;left:50%;transform:translateX(-50%);
  font-size:.72rem;color:rgba(255,255,255,.5);white-space:nowrap;text-align:center;
  display:flex;align-items:center;gap:5px;
}
.frame-hint svg{width:11px;height:11px;stroke:rgba(255,255,255,.4);fill:none;stroke-width:2;}

/* Corner SVG icons */
.frame-deco{position:absolute;pointer-events:none;opacity:.08;}
.fd1{top:50%;left:50%;transform:translate(-50%,-50%);}

/* ── BOTTOM CONTROLS ── */
.bottom-controls{
  padding:0 28px calc(env(safe-area-inset-bottom,20px) + 40px);
  background:linear-gradient(to top,rgba(0,0,0,.85),transparent);
  pointer-events:all;
}
.controls-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;}

/* Side buttons */
.ctrl-btn{
  width:46px;height:46px;border-radius:14px;
  background:rgba(255,255,255,.08);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
}
.ctrl-btn:hover{background:rgba(255,255,255,.16);}
.ctrl-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;}
.ctrl-btn.active{background:var(--teal-s);border-color:var(--teal-m);}
.ctrl-btn.active svg{stroke:var(--teal);}

/* Capture button */
.capture-btn{
  width:76px;height:76px;border-radius:50%;
  background:rgba(255,255,255,.12);border:2.5px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
  box-shadow:0 0 0 0 rgba(26,138,114,0);
}
.capture-btn:active{transform:scale(.93);}
.capture-btn.scanning{border-color:var(--teal);box-shadow:0 0 0 8px rgba(26,138,114,.15),0 0 32px rgba(26,138,114,.2);}
.capture-inner{
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--teal),#158068);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(26,138,114,.4);transition:all .2s;
}
.capture-inner svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;}
.capture-btn:active .capture-inner{transform:scale(.9);}
.capture-btn.scanning .capture-inner{animation:captureGlow 1s ease-in-out infinite alternate;}
@keyframes captureGlow{from{box-shadow:0 4px 20px rgba(26,138,114,.4);}to{box-shadow:0 4px 40px rgba(26,138,114,.7);}}

.ctrl-label{font-size:.58rem;color:rgba(255,255,255,.35);margin-top:5px;text-align:center;}

/* ── STATUS ── */
.status-bubble{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(10,14,24,.95);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:20px;
  padding:18px 24px;display:none;flex-direction:column;
  align-items:center;gap:12px;z-index:50;min-width:180px;
}
.status-bubble.show{display:flex;}
.sb-ring{width:28px;height:28px;border:2px solid var(--teal-s);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.sb-text{font-size:.78rem;font-weight:600;color:#fff;}
.sb-sub{font-size:.65rem;color:var(--muted);}

/* ── RESULT PANEL ── */
.result-panel{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(8,12,24,.98);backdrop-filter:blur(24px);
  border:1px solid var(--border);border-bottom:none;
  border-radius:24px 24px 0 0;
  padding:0 0 calc(env(safe-area-inset-bottom,16px) + 16px);
  transform:translateY(100%);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  z-index:40;max-height:75vh;overflow-y:auto;
}
.result-panel.show{transform:translateY(0);}

.rp-handle{width:36px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:14px auto 0;}
.rp-header{padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between;}
.rp-title{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:800;color:#fff;display:flex;align-items:center;gap:7px;}
.rp-title-ico{width:24px;height:24px;border-radius:7px;background:var(--teal-s);display:flex;align-items:center;justify-content:center;}
.rp-title-ico svg{width:12px;height:12px;stroke:var(--teal);fill:none;stroke-width:2;}
.rp-close{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#fff;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.rp-close:hover{background:rgba(255,255,255,.18);}
.rp-close svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.5;}

.rp-body{padding:14px 18px 0;}

/* Preview strip */
.rp-preview{
  width:100%;height:120px;border-radius:14px;overflow:hidden;
  margin-bottom:12px;position:relative;display:none;
}
.rp-preview.show{display:block;}
.rp-preview img{width:100%;height:100%;object-fit:cover;}
.rp-preview-overlay{position:absolute;inset:0;background:linear-gradient(to right,transparent 50%,rgba(0,0,0,.5));}
.rp-preview-badge{position:absolute;top:8px;right:8px;padding:3px 8px;background:rgba(26,138,114,.8);border-radius:100px;font-size:.58rem;font-weight:700;color:#fff;}

/* Text boxes */
.txt-box{border-radius:14px;padding:14px;margin-bottom:8px;}
.tb-orig{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);}
.tb-trans{background:rgba(26,138,114,.08);border:1px solid rgba(26,138,114,.2);}
.tb-label{font-size:.58rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:5px;}
.tb-label svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;}
.tb-orig .tb-label{color:rgba(255,255,255,.35);}
.tb-trans .tb-label{color:var(--teal);}
.tb-content{font-size:.9rem;line-height:1.65;color:rgba(255,255,255,.85);}
.tb-trans .tb-content{color:#7FFFD4;font-weight:500;}
.tb-lang{font-size:.62rem;color:rgba(255,255,255,.25);margin-top:5px;}

/* Error */
.rp-error{background:rgba(216,76,62,.08);border:1px solid rgba(216,76,62,.2);border-radius:14px;padding:13px;font-size:.78rem;color:#FF8090;line-height:1.5;display:none;}
.rp-error.show{display:block;}

/* Actions */
.rp-actions{display:flex;gap:7px;padding:10px 18px 4px;}
.rp-btn{flex:1;padding:11px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:rgba(255,255,255,.7);font-family:'Inter',sans-serif;font-size:.72rem;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px;}
.rp-btn:hover{background:rgba(255,255,255,.12);}
.rp-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;}
.rp-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;}
.rp-btn.primary:hover{background:#158068;}

/* ── NO CAMERA ── */
.no-cam{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;text-align:center;z-index:60;}
.no-cam.show{display:flex;}
.no-cam-ico{width:80px;height:80px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
.no-cam-ico svg{width:36px;height:36px;stroke:rgba(255,255,255,.3);fill:none;stroke-width:1.5;}
.no-cam-title{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;color:#fff;}
.no-cam-sub{font-size:.8rem;color:var(--muted);line-height:1.7;max-width:280px;}
.no-cam-btn{padding:13px 28px;background:var(--teal);color:#fff;border:none;border-radius:100px;font-family:'Inter',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px;}
.no-cam-btn:hover{background:#158068;}
.no-cam-btn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;}

/* ── TOAST ── */
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(26,138,114,.95);color:#fff;padding:9px 18px;border-radius:100px;font-size:.72rem;font-weight:700;opacity:0;transition:all .3s;z-index:100;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── MODE BADGE ── */
.mode-badge{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.5);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:100px;
  padding:4px 12px;font-size:.65rem;font-weight:700;color:rgba(255,255,255,.6);
  z-index:15;pointer-events:none;letter-spacing:.5px;
}

/* ── HISTORY PILL ── */
.history-strip{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);left:0;right:0;
  display:flex;gap:8px;padding:0 16px;overflow-x:auto;scrollbar-width:none;z-index:12;
  pointer-events:all;
}
.history-strip::-webkit-scrollbar{display:none;}
.hist-item{
  flex-shrink:0;padding:5px 12px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  border-radius:100px;font-size:.62rem;font-weight:600;color:rgba(255,255,255,.5);
  cursor:pointer;transition:all .2s;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;
}
.hist-item:hover{background:rgba(255,255,255,.15);color:#fff;}
</style>
</head>
<body>

<!-- Camera -->
<div class="cam-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<!-- Full Overlay -->
<div class="overlay">

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="tb-left">
      <a href="/app" class="tb-back"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></a>
      <div class="tb-logo">Yaply <span>Cam</span></div>
    </div>
    <div class="lang-selector">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <select id="targetLang">
        <option value="EN">→ English</option>
        <option value="HI">→ Hindi</option>
        <option value="ES">→ Spanish</option>
        <option value="FR">→ French</option>
        <option value="DE">→ German</option>
        <option value="JA">→ Japanese</option>
        <option value="ZH">→ Chinese</option>
        <option value="AR">→ Arabic</option>
        <option value="PT">→ Portuguese</option>
        <option value="RU">→ Russian</option>
        <option value="IT">→ Italian</option>
        <option value="KO">→ Korean</option>
      </select>
    </div>
  </div>

  <!-- Scan Frame -->
  <div class="scan-frame">
    <!-- Decorative background SVGs -->
    <div class="frame-deco fd1" style="opacity:.04;">
      <svg width="200" height="200" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width=".5"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    </div>

    <div class="frame-outer">
      <div class="frame-pulse"></div>
      <div class="corner c-tl"></div>
      <div class="corner c-tr"></div>
      <div class="corner c-bl"></div>
      <div class="corner c-br"></div>
      <div class="scan-beam" id="scanBeam"></div>
      <div class="frame-hint" id="frameHint">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Point at any text and tap
      </div>
    </div>
  </div>

  <!-- Bottom Controls -->
  <div class="bottom-controls">
    <div class="controls-inner">
      <!-- Upload -->
      <div>
        <div class="ctrl-btn" onclick="document.getElementById('fileInput').click()" title="Upload image">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="ctrl-label">Upload</div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleUpload(event)"/>
      </div>

      <!-- Capture -->
      <div style="display:flex;flex-direction:column;align-items:center;">
        <div class="capture-btn" id="captureBtn" onclick="capture()">
          <div class="capture-inner">
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
        </div>
        <div class="ctrl-label" style="margin-top:7px;">Scan & Translate</div>
      </div>

      <!-- Flash toggle -->
      <div>
        <div class="ctrl-btn" id="flashBtn" onclick="toggleFlash()" title="Toggle flash">
          <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <div class="ctrl-label">Flash</div>
      </div>
    </div>
  </div>
</div>

<!-- Mode badge -->
<div class="mode-badge" id="modeBadge">Camera Ready</div>

<!-- History strip -->
<div class="history-strip" id="historyStrip"></div>

<!-- Status bubble -->
<div class="status-bubble" id="statusBubble">
  <div class="sb-ring"></div>
  <div class="sb-text" id="sbText">Reading text...</div>
  <div class="sb-sub" id="sbSub">Using AI vision</div>
</div>

<!-- Result Panel -->
<div class="result-panel" id="resultPanel">
  <div class="rp-handle"></div>
  <div class="rp-header">
    <div class="rp-title">
      <div class="rp-title-ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
      Translation Result
    </div>
    <button class="rp-close" onclick="closePanel()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="rp-body">
    <div class="rp-preview" id="rpPreview">
      <img id="rpImg" src="" alt=""/>
      <div class="rp-preview-overlay"></div>
      <div class="rp-preview-badge">Scanned</div>
    </div>
    <div class="rp-error" id="rpError"></div>
    <div class="txt-box tb-orig" id="tbOrig" style="display:none;">
      <div class="tb-label">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Detected Text
      </div>
      <div class="tb-content" id="tbOrigText"></div>
      <div class="tb-lang" id="tbOrigLang"></div>
    </div>
    <div class="txt-box tb-trans" id="tbTrans" style="display:none;">
      <div class="tb-label">
        <svg viewBox="0 0 24 24"><path d="M3 5h12M9 3v2m-3.5 8.5L3 21l4.5-3.5M12 5l-4 11M5 8h7M21 12h-5m0 0l3 3m-3-3l3-3"/></svg>
        Translation
      </div>
      <div class="tb-content" id="tbTransText"></div>
      <div class="tb-lang" id="tbTransLang"></div>
    </div>
  </div>
  <div class="rp-actions" id="rpActions" style="display:none;">
    <button class="rp-btn" onclick="copyResult()">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy
    </button>
    <button class="rp-btn" onclick="shareResult()">
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      Share
    </button>
    <button class="rp-btn primary" onclick="closePanel()">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/></svg>
      Scan Again
    </button>
  </div>
</div>

<!-- No Camera -->
<div class="no-cam" id="noCam">
  <div class="no-cam-ico">
    <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
  </div>
  <div class="no-cam-title">Camera Access Needed</div>
  <div class="no-cam-sub">Allow camera access in your browser, or upload an image to translate any text.</div>
  <button class="no-cam-btn" onclick="document.getElementById('fileInput2').click()">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Upload Image to Translate
  </button>
  <input type="file" id="fileInput2" accept="image/*" style="display:none" onchange="handleUpload(event)"/>
  <a href="/app" style="font-size:.72rem;color:rgba(255,255,255,.3);text-decoration:none;margin-top:4px;">← Back to Dashboard</a>
</div>

<div class="toast" id="toast"></div>
<script src="/static/yaply-nav.js"></script>
<script>
let videoStream = null;
let isCapturing = false;
let flashOn = false;
let scanHistory = [];

// ── CAMERA ──
async function startCamera() {
  try {
    const constraints = {
      video: { facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } }
    };
    videoStream = await navigator.mediaDevices.getUserMedia(constraints);
    document.getElementById('video').srcObject = videoStream;
    await document.getElementById('video').play();
    setMode('Camera Ready');
  } catch(e) {
    document.getElementById('noCam').classList.add('show');
    setMode('No Camera');
  }
}

function setMode(text) {
  document.getElementById('modeBadge').textContent = text;
}

// ── FLASH ──
function toggleFlash() {
  const btn = document.getElementById('flashBtn');
  flashOn = !flashOn;
  btn.classList.toggle('active', flashOn);
  if (videoStream) {
    const track = videoStream.getVideoTracks()[0];
    if (track?.getCapabilities()?.torch) {
      track.applyConstraints({ advanced: [{ torch: flashOn }] });
    }
  }
  showToast(flashOn ? 'Flash on' : 'Flash off');
}

// ── CAPTURE ──
async function capture() {
  if (isCapturing) return;
  isCapturing = true;

  const btn = document.getElementById('captureBtn');
  const beam = document.getElementById('scanBeam');
  const hint = document.getElementById('frameHint');

  btn.classList.add('scanning');
  beam.classList.add('active');
  hint.innerHTML = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Scanning...';
  setMode('Scanning...');

  try {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const imageData = canvas.toDataURL('image/jpeg', 0.92);

    document.getElementById('rpImg').src = imageData;
    document.getElementById('rpPreview').classList.add('show');

    showStatus('Reading text...', 'AI Vision active');
    const lang = document.getElementById('targetLang').value;
    const res = await apiFetch('/scan', { method:'POST', body: JSON.stringify({ image:imageData, target_lang:lang }) });
    showResult(res);
    if (res.success) addToHistory(res.original_text, res.translated_text);
  } catch(e) {
    showResult({ success:false, error:'Failed to process. Please try again.' });
  } finally {
    isCapturing = false;
    btn.classList.remove('scanning');
    beam.classList.remove('active');
    hint.innerHTML = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Point at any text and tap';
    setMode('Camera Ready');
    hideStatus();
  }
}

// ── UPLOAD ──
function handleUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('noCam').classList.remove('show');
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const imageData = ev.target.result;
    document.getElementById('rpImg').src = imageData;
    document.getElementById('rpPreview').classList.add('show');
    showStatus('Reading text...', 'Processing image');
    const lang = document.getElementById('targetLang').value;
    try {
      const res = await apiFetch('/scan', { method:'POST', body: JSON.stringify({ image:imageData, target_lang:lang }) });
      showResult(res);
      if (res.success) addToHistory(res.original_text, res.translated_text);
    } catch(err) {
      showResult({ success:false, error:'Failed to process image.' });
    } finally { hideStatus(); }
  };
  reader.readAsDataURL(file);
}

// ── RESULT ──
function showResult(data) {
  const panel = document.getElementById('resultPanel');
  document.getElementById('rpError').classList.remove('show');
  document.getElementById('tbOrig').style.display = 'none';
  document.getElementById('tbTrans').style.display = 'none';
  document.getElementById('rpActions').style.display = 'none';

  if (data.success) {
    document.getElementById('tbOrigText').textContent = data.original_text || '';
    document.getElementById('tbOrigLang').textContent = data.detected_lang ? 'Detected: ' + data.detected_lang.toUpperCase() : '';
    document.getElementById('tbTransText').textContent = data.translated_text || '';
    const lang = document.getElementById('targetLang').options[document.getElementById('targetLang').selectedIndex].text;
    document.getElementById('tbTransLang').textContent = 'Translated to ' + lang + (data.engine ? ' via ' + data.engine : '');
    document.getElementById('tbOrig').style.display = 'block';
    document.getElementById('tbTrans').style.display = 'block';
    document.getElementById('rpActions').style.display = 'flex';
  } else {
    const err = document.getElementById('rpError');
    err.textContent = data.error || 'No text found. Try pointing at clearer text.';
    err.classList.add('show');
  }
  panel.classList.add('show');
}

function closePanel() {
  document.getElementById('resultPanel').classList.remove('show');
  document.getElementById('rpPreview').classList.remove('show');
}

// ── HISTORY ──
function addToHistory(original, translated) {
  scanHistory.unshift({ original: original?.substring(0,40), translated: translated?.substring(0,40) });
  if (scanHistory.length > 5) scanHistory.pop();
  renderHistory();
}

function renderHistory() {
  const strip = document.getElementById('historyStrip');
  strip.innerHTML = scanHistory.map((h,i) => `
    <div class="hist-item" onclick="showHistItem(${i})" title="${h.translated}">${h.translated || h.original}</div>`).join('');
}

function showHistItem(i) {
  const h = scanHistory[i];
  document.getElementById('tbOrigText').textContent = h.original;
  document.getElementById('tbTransText').textContent = h.translated;
  document.getElementById('tbOrig').style.display = 'block';
  document.getElementById('tbTrans').style.display = 'block';
  document.getElementById('rpActions').style.display = 'flex';
  document.getElementById('rpError').classList.remove('show');
  document.getElementById('resultPanel').classList.add('show');
}

// ── STATUS ──
function showStatus(text, sub) {
  document.getElementById('sbText').textContent = text;
  document.getElementById('sbSub').textContent = sub || '';
  document.getElementById('statusBubble').classList.add('show');
}
function hideStatus() { document.getElementById('statusBubble').classList.remove('show'); }

// ── COPY / SHARE ──
function copyResult() {
  const text = document.getElementById('tbTransText').textContent;
  navigator.clipboard?.writeText(text);
  showToast('Copied to clipboard');
}
function shareResult() {
  const orig = document.getElementById('tbOrigText').textContent;
  const trans = document.getElementById('tbTransText').textContent;
  if (navigator.share) {
    navigator.share({ title:'Yaply Translation', text:`Original: ${orig}\n\nTranslation: ${trans}\n\nTranslated by Yaply` });
  } else { copyResult(); }
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

startCamera();
</script>
</body>
</html>

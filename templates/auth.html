<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Yaply — Sign In</title>
<link rel="stylesheet" href="/static/yaply-design.css"/>
<link rel="icon" href="/static/favicon.png" type="image/png"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

/* Colorful background blobs */
.bg-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.18;
  pointer-events: none;
}
.blob-1 { width:350px;height:350px;background:var(--orange);top:-100px;right:-80px;animation:yFloat 6s ease-in-out infinite; }
.blob-2 { width:300px;height:300px;background:var(--blue);bottom:-80px;left:-60px;animation:yFloat 8s 1s ease-in-out infinite; }
.blob-3 { width:200px;height:200px;background:var(--purple);top:40%;right:5%;animation:yFloat 7s 2s ease-in-out infinite; }
.blob-4 { width:180px;height:180px;background:var(--green);bottom:20%;left:5%;animation:yFloat 9s 0.5s ease-in-out infinite; }

/* Color strip top */
.top-strip {
  position:fixed;top:0;left:0;right:0;height:5px;z-index:100;
  background:linear-gradient(90deg,var(--blue),var(--orange),var(--red),var(--green),var(--gold),var(--purple));
}

/* Card */
.auth-card {
  width:100%;max-width:400px;
  background:white;
  border-radius:28px;
  padding:36px 32px;
  box-shadow:0 20px 80px rgba(0,0,0,0.1),0 4px 20px rgba(0,0,0,0.06);
  position:relative;z-index:1;
  animation:yFadeUp 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  border:1px solid var(--border);
}

/* Logo area */
.auth-logo-wrap {
  text-align:center;
  margin-bottom:28px;
}
.auth-logo-img {
  height:60px;
  width:auto;
  margin-bottom:8px;
}
.auth-logo-text {
  font-family:var(--font-display);
  font-size:2rem;
  background:linear-gradient(135deg,var(--orange),var(--red),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:-0.5px;
}
.auth-tagline {
  font-size:0.78rem;
  color:var(--muted);
  font-weight:600;
  margin-top:4px;
}

/* Tabs */
.auth-tabs {
  display:flex;
  background:var(--bg2);
  border-radius:100px;
  padding:4px;
  margin-bottom:24px;
  gap:2px;
}
.auth-tab {
  flex:1;padding:9px;border-radius:100px;
  font-family:var(--font-body);
  font-size:0.82rem;font-weight:800;
  cursor:pointer;transition:all 0.25s;
  background:none;border:none;color:var(--muted);
}
.auth-tab.active {
  background:white;
  color:var(--orange);
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
}

/* Form */
.fg { margin-bottom:16px; }
.fi-wrap { position:relative; }
.fi-icon { position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:0.9rem; }

/* Password strength */
.pw-strength {
  height:4px;border-radius:2px;
  background:var(--bg2);margin-top:6px;overflow:hidden;
}
.pw-fill { height:100%;border-radius:2px;transition:all 0.35s;width:0; }

/* Alert */
.y-alert {
  padding:12px 16px;border-radius:12px;
  font-size:0.8rem;font-weight:700;
  margin-bottom:16px;display:none;
  align-items:center;gap:8px;
  font-family:var(--font-body);
}
.y-alert.error { background:var(--red-soft);color:var(--red);border:1px solid rgba(232,71,74,0.2); }
.y-alert.success { background:var(--green-soft);color:var(--green);border:1px solid rgba(43,175,126,0.2); }
.y-alert.show { display:flex; }

/* Google btn */
.google-btn {
  width:100%;padding:13px;
  background:white;color:var(--text);
  border:2px solid var(--border2);
  border-radius:100px;
  font-family:var(--font-body);
  font-size:0.88rem;font-weight:800;
  cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.google-btn:hover { border-color:var(--orange);color:var(--orange);transform:translateY(-2px);box-shadow:var(--shadow-sm); }

/* Screen */
.auth-screen { display:none; }
.auth-screen.active { display:block; }

/* Fun travel icons */
.travel-icons {
  position:absolute;
  font-size:1.5rem;
  opacity:0.12;
  pointer-events:none;
}

/* Bottom link */
.auth-footer { text-align:center;margin-top:18px;font-size:0.78rem;color:var(--muted);font-weight:600; }
.auth-footer a { color:var(--orange);text-decoration:none;font-weight:800; }

/* Btn loading */
.btn-spinner {
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,0.3);
  border-top-color:white;
  border-radius:50%;
  animation:ySpin 0.7s linear infinite;
  display:inline-block;
}
</style>
</head>
<body>

<!-- Color strip -->
<div class="top-strip"></div>

<!-- Background blobs -->
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="bg-blob blob-3"></div>
<div class="bg-blob blob-4"></div>

<!-- Floating travel emojis -->
<div class="travel-icons" style="top:15%;left:8%;animation:yFloat 5s ease-in-out infinite;">✈️</div>
<div class="travel-icons" style="top:70%;right:10%;animation:yFloat 7s 1s ease-in-out infinite;">🌍</div>
<div class="travel-icons" style="top:40%;left:3%;animation:yFloat 6s 2s ease-in-out infinite;">🗺️</div>
<div class="travel-icons" style="bottom:15%;right:5%;animation:yFloat 8s 0.5s ease-in-out infinite;">🏝️</div>
<div class="travel-icons" style="top:10%;right:12%;animation:yFloat 9s 1.5s ease-in-out infinite;">🏔️</div>

<!-- Auth Card -->
<div class="auth-card">

  <!-- Logo -->
  <div class="auth-logo-wrap">
    <img src="/static/yaply-logo.png" alt="Yaply" class="auth-logo-img"
         onerror="this.style.display='none';document.getElementById('logoText').style.display='block'"/>
    <div class="auth-logo-text" id="logoText">Yaply</div>
    <div class="auth-tagline">✈️ Your AI Travel Companion</div>
  </div>

  <!-- Tabs -->
  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
    <button class="auth-tab" onclick="switchTab('signup')">Create Account</button>
  </div>

  <!-- Alert -->
  <div class="y-alert" id="alert"></div>

  <!-- LOGIN -->
  <div class="auth-screen active" id="loginScreen">
    <div class="fg">
      <label class="y-label">📧 Email Address</label>
      <input class="y-input" type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="fg">
      <label class="y-label">🔒 Password</label>
      <div class="fi-wrap">
        <input class="y-input" type="password" id="loginPassword" placeholder="Your password" autocomplete="current-password" style="padding-right:44px;"/>
        <span class="fi-icon" onclick="togglePw('loginPassword',this)">👁️</span>
      </div>
    </div>
    <button class="y-btn y-btn-primary y-btn-full y-btn-lg" id="loginBtn" onclick="doLogin()" style="margin-top:4px;">
      Sign In ✈️
    </button>
    <div class="y-divider">or continue with</div>
    <button class="google-btn" onclick="googleSignIn()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>
    <div class="auth-footer">No account? <a href="#" onclick="switchTab('signup')">Create one free</a></div>
  </div>

  <!-- SIGNUP -->
  <div class="auth-screen" id="signupScreen">
    <div class="fg">
      <label class="y-label">👤 Full Name</label>
      <input class="y-input" type="text" id="signupName" placeholder="Your full name" autocomplete="name"/>
    </div>
    <div class="fg">
      <label class="y-label">📧 Email Address</label>
      <input class="y-input" type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="fg">
      <label class="y-label">🔒 Password</label>
      <div class="fi-wrap">
        <input class="y-input" type="password" id="signupPassword" placeholder="Min 8 characters" autocomplete="new-password" style="padding-right:44px;" oninput="checkStrength(this.value)"/>
        <span class="fi-icon" onclick="togglePw('signupPassword',this)">👁️</span>
      </div>
      <div class="pw-strength"><div class="pw-fill" id="psFill"></div></div>
    </div>
    <button class="y-btn y-btn-primary y-btn-full y-btn-lg" id="signupBtn" onclick="doSignup()" style="margin-top:4px;">
      Create Account 🚀
    </button>
    <div class="y-divider">or</div>
    <button class="google-btn" onclick="googleSignIn()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign up with Google
    </button>
    <div class="auth-footer">Already have an account? <a href="#" onclick="switchTab('login')">Sign in</a></div>
  </div>

</div>

<script>
const GOOGLE_CLIENT_ID = '{{ google_client_id }}';

// Check already logged in
(function(){
  const token = localStorage.getItem('yaply_token');
  if(token){
    fetch('/api/auth/me',{headers:{'Authorization':'Bearer '+token}})
    .then(r=>r.json()).then(d=>{
      if(d.success){
        const redirect=new URLSearchParams(window.location.search).get('redirect')||'/app';
        window.location.href=redirect;
      }
    }).catch(()=>{});
  }
})();

function switchTab(tab){
  document.getElementById('loginScreen').classList.toggle('active',tab==='login');
  document.getElementById('signupScreen').classList.toggle('active',tab==='signup');
  document.querySelectorAll('.auth-tab').forEach((t,i)=>{
    t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='signup'));
  });
  hideAlert();
}

function showAlert(msg,type='error'){
  const el=document.getElementById('alert');
  el.textContent=(type==='error'?'⚠️ ':'✅ ')+msg;
  el.className=`y-alert ${type} show`;
}
function hideAlert(){ document.getElementById('alert').className='y-alert'; }

function togglePw(id,icon){
  const inp=document.getElementById(id);
  if(inp.type==='password'){inp.type='text';icon.textContent='🙈';}
  else{inp.type='password';icon.textContent='👁️';}
}

function checkStrength(pw){
  const fill=document.getElementById('psFill');
  let score=0;
  if(pw.length>=8)score++;
  if(pw.length>=12)score++;
  if(/[A-Z]/.test(pw))score++;
  if(/[0-9]/.test(pw))score++;
  if(/[^A-Za-z0-9]/.test(pw))score++;
  const colors=['','#E8474A','#F5A623','#F4642A','#2BAF7E','#2BAF7E'];
  const widths=['0%','20%','40%','60%','80%','100%'];
  fill.style.width=widths[score];
  fill.style.background=colors[score];
}

function setLoading(btnId,loading){
  const btn=document.getElementById(btnId);
  if(loading){
    btn.disabled=true;
    btn.innerHTML='<div class="btn-spinner"></div>';
  } else {
    btn.disabled=false;
    btn.innerHTML=btnId==='loginBtn'?'Sign In ✈️':'Create Account 🚀';
  }
}

async function doLogin(){
  hideAlert();
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  if(!email||!password){showAlert('Please fill in all fields');return;}
  setLoading('loginBtn',true);
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(data.success){
      localStorage.setItem('yaply_token',data.token);
      localStorage.setItem('yaply_user',JSON.stringify(data.user));
      showAlert(data.message,'success');
      setTimeout(()=>{
        const redirect=new URLSearchParams(window.location.search).get('redirect')||'/app';
        window.location.href=redirect;
      },700);
    } else { showAlert(data.error||'Login failed'); }
  } catch(e){ showAlert('Connection error. Please try again.'); }
  setLoading('loginBtn',false);
}

async function doSignup(){
  hideAlert();
  const name=document.getElementById('signupName').value.trim();
  const email=document.getElementById('signupEmail').value.trim();
  const password=document.getElementById('signupPassword').value;
  if(!name||!email||!password){showAlert('Please fill in all fields');return;}
  if(password.length<8){showAlert('Password must be at least 8 characters');return;}
  setLoading('signupBtn',true);
  try{
    const res=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password})});
    const data=await res.json();
    if(data.success){
      localStorage.setItem('yaply_token',data.token);
      localStorage.setItem('yaply_user',JSON.stringify(data.user));
      showAlert(data.message,'success');
      setTimeout(()=>window.location.href='/app',700);
    } else { showAlert(data.error||'Signup failed'); }
  } catch(e){ showAlert('Connection error. Please try again.'); }
  setLoading('signupBtn',false);
}

function googleSignIn(){
  if(!GOOGLE_CLIENT_ID||GOOGLE_CLIENT_ID===''){
    showAlert('Google login not set up yet. Please use email login.','error');return;
  }
  google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleGoogleCallback,auto_select:false});
  google.accounts.id.prompt();
}

async function handleGoogleCallback(response){
  try{
    const res=await fetch('/api/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id_token:response.credential})});
    const data=await res.json();
    if(data.success){
      localStorage.setItem('yaply_token',data.token);
      localStorage.setItem('yaply_user',JSON.stringify(data.user));
      showAlert(data.message,'success');
      setTimeout(()=>window.location.href='/app',700);
    } else { showAlert(data.error||'Google login failed'); }
  } catch(e){ showAlert('Google login failed. Please use email.'); }
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(document.getElementById('loginScreen').classList.contains('active'))doLogin();
  else doSignup();
});
</script>
</body>
</html>

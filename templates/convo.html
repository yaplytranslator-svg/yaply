<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Yaply Convo — Live Two-Way Translation</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --border: rgba(0,0,0,0.07);
    --accent: #00C9A7;
    --accent2: #00A896;
    --text: #0A0A0A;
    --muted: #6B6B6B;
    --a-color: #4A90D9;
    --b-color: #00C9A7;
    --a-soft: rgba(74,144,217,0.1);
    --b-soft: rgba(0,201,167,0.1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Geist', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    max-width: 420px;
    margin: 0 auto;
  }

  /* ── HEADER ── */
  .header {
    padding: 52px 20px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    justify-content: space-between;
  }
  .header-title {
    font-family: 'Instrument Serif', serif;
    font-size: 1.4rem;
  }
  .header-title em { color: var(--accent); font-style: italic; }
  .status-dot {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.75rem; color: var(--muted);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%; background: #ccc;
  }
  .dot.live { background: var(--accent); animation: pulse 1.5s infinite; }

  /* ── LANG CONFIG ── */
  .lang-config {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 10px; align-items: center;
    padding: 14px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .speaker-lang {
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
  }
  .speaker-label {
    font-size: 0.62rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .speaker-label.a { color: var(--a-color); }
  .speaker-label.b { color: var(--b-color); }
  .lang-select-pill {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 100px;
    padding: 6px 14px;
    font-family: 'Geist', sans-serif;
    font-size: 0.82rem; font-weight: 600;
    color: var(--text); cursor: pointer;
    outline: none; text-align: center;
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
  }
  .lang-select-pill.a:focus { border-color: var(--a-color); }
  .lang-select-pill.b:focus { border-color: var(--b-color); }
  .lang-arrow {
    font-size: 1rem; color: var(--muted);
    text-align: center;
  }

  /* ── CONVERSATION FEED ── */
  .convo-feed {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column;
    gap: 12px;
  }
  .convo-feed::-webkit-scrollbar { display: none; }

  .empty-convo {
    flex: 1; display: flex;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; text-align: center;
    color: var(--muted);
    padding: 40px;
  }
  .empty-icon { font-size: 3rem; opacity: 0.3; }
  .empty-title {
    font-family: 'Instrument Serif', serif;
    font-size: 1.2rem; color: var(--text);
  }
  .empty-sub { font-size: 0.82rem; line-height: 1.6; }

  /* Message bubbles */
  .msg-wrap {
    display: flex; flex-direction: column;
    animation: slideIn 0.3s ease;
    max-width: 85%;
  }
  .msg-wrap.speaker-a { align-self: flex-start; }
  .msg-wrap.speaker-b { align-self: flex-end; }

  .msg-speaker-tag {
    font-size: 0.62rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 4px; padding: 0 4px;
  }
  .speaker-a .msg-speaker-tag { color: var(--a-color); }
  .speaker-b .msg-speaker-tag { color: var(--b-color); text-align: right; }

  .msg-bubble {
    border-radius: 18px;
    padding: 12px 16px;
    position: relative;
  }
  .speaker-a .msg-bubble {
    background: var(--a-soft);
    border: 1px solid rgba(74,144,217,0.2);
    border-bottom-left-radius: 6px;
  }
  .speaker-b .msg-bubble {
    background: var(--b-soft);
    border: 1px solid rgba(0,201,167,0.2);
    border-bottom-right-radius: 6px;
  }

  .msg-original {
    font-size: 0.8rem; color: var(--muted);
    margin-bottom: 6px; font-style: italic;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .msg-translation {
    font-size: 0.95rem; font-weight: 500;
    line-height: 1.5;
  }
  .speaker-a .msg-translation { color: var(--a-color); }
  .speaker-b .msg-translation { color: var(--accent2); }

  .msg-meta {
    display: flex; align-items: center;
    gap: 8px; margin-top: 6px; padding: 0 4px;
    justify-content: space-between;
  }
  .msg-engine {
    font-size: 0.62rem; color: var(--muted);
  }
  .msg-time { font-size: 0.62rem; color: var(--muted); }
  .msg-replay {
    width: 24px; height: 24px;
    border-radius: 50%; border: none;
    background: rgba(0,0,0,0.06);
    cursor: pointer; font-size: 0.6rem;
    color: var(--muted);
    display: flex; align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .msg-replay:hover { background: var(--accent); color: white; }

  /* ── SPEAKER CONTROLS ── */
  .speaker-controls {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px;
  }

  /* Speaker toggle */
  .speaker-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 14px;
  }
  .speaker-btn {
    padding: 12px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--bg);
    font-family: 'Geist', sans-serif;
    font-size: 0.82rem; font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center;
    justify-content: center; gap: 8px;
    color: var(--muted);
  }
  .speaker-btn.a.active {
    border-color: var(--a-color);
    background: var(--a-soft);
    color: var(--a-color);
  }
  .speaker-btn.b.active {
    border-color: var(--b-color);
    background: var(--b-soft);
    color: var(--b-color);
  }
  .speaker-btn .spk-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
  }

  /* Big mic button */
  .main-mic-area {
    display: flex; flex-direction: column;
    align-items: center; gap: 10px;
  }
  .main-mic-wrap {
    position: relative;
    width: 80px; height: 80px;
    display: flex; align-items: center;
    justify-content: center;
  }
  .mic-ring {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
  }
  .mic-ring-1 { width: 60px; height: 60px; border: 1.5px solid var(--a-color); }
  .mic-ring-2 { width: 72px; height: 72px; border: 1.5px solid var(--a-color); }
  .mic-ring-3 { width: 80px; height: 80px; border: 1.5px solid var(--a-color); }

  .mic-ring.b-ring-1 { border-color: var(--b-color); }
  .mic-ring.b-ring-2 { border-color: var(--b-color); }
  .mic-ring.b-ring-3 { border-color: var(--b-color); }

  .pulsing .mic-ring-1 { animation: ripple 1.5s 0.0s ease-out infinite; }
  .pulsing .mic-ring-2 { animation: ripple 1.5s 0.3s ease-out infinite; }
  .pulsing .mic-ring-3 { animation: ripple 1.5s 0.6s ease-out infinite; }

  .main-mic-btn {
    width: 56px; height: 56px;
    border-radius: 50%; border: none;
    font-size: 1.5rem; cursor: pointer;
    display: flex; align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    position: relative; z-index: 1;
    background: linear-gradient(135deg, var(--a-color), #6AA8E8);
    box-shadow: 0 6px 20px rgba(74,144,217,0.35);
  }
  .main-mic-btn.b-mode {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 6px 20px rgba(0,201,167,0.35);
  }
  .main-mic-btn.listening {
    background: linear-gradient(135deg, #FF4757, #FF6B6B);
    box-shadow: 0 6px 20px rgba(255,71,87,0.35);
    animation: micPulse 0.8s infinite;
  }
  .main-mic-btn:hover { transform: scale(1.08); }

  .mic-status {
    font-size: 0.8rem; color: var(--muted);
    text-align: center; line-height: 1.4;
  }
  .mic-status.listening-a { color: var(--a-color); font-weight: 600; }
  .mic-status.listening-b { color: var(--b-color); font-weight: 600; }

  /* Vol meter */
  .vol-bars {
    display: flex; align-items: flex-end;
    gap: 2px; height: 24px; opacity: 0;
    transition: opacity 0.3s;
  }
  .vol-bars.show { opacity: 1; }
  .vol-bar {
    width: 3px; border-radius: 1.5px;
    background: var(--accent); height: 3px;
    transition: height 0.08s ease;
  }

  /* Status pill */
  .status-pill {
    display: none; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.06);
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 0.75rem; color: var(--muted);
  }
  .status-pill.show { display: flex; }
  .pill-spin {
    width: 10px; height: 10px;
    border: 1.5px solid rgba(0,201,167,0.3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* Start/Stop btn */
  .session-btn {
    width: 100%; padding: 14px;
    border-radius: 100px; border: none;
    font-family: 'Geist', sans-serif;
    font-size: 0.9rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    margin-top: 12px;
    display: flex; align-items: center;
    justify-content: center; gap: 8px;
  }
  .session-btn.start {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    box-shadow: 0 6px 20px rgba(0,201,167,0.3);
  }
  .session-btn.stop {
    background: rgba(255,71,87,0.1);
    color: #FF4757;
    border: 1.5px solid rgba(255,71,87,0.2);
  }

  @keyframes ripple { 0%{transform:scale(0.8);opacity:0.7} 100%{transform:scale(1.5);opacity:0} }
  @keyframes micPulse { 0%,100%{box-shadow:0 6px 20px rgba(255,71,87,0.35)} 50%{box-shadow:0 6px 32px rgba(255,71,87,0.6)} }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes slideIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
</style>
<link rel="stylesheet" href="/static/yaply-theme.css"/>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-title">Live <em>Conversation</em></div>
  <div class="status-dot">
    <div class="dot" id="liveDot"></div>
    <span id="liveText">Ready</span>
  </div>
</div>

<!-- Language Config -->
<div class="lang-config">
  <div class="speaker-lang">
    <div class="speaker-label a">👤 Person A</div>
    <select class="lang-select-pill a" id="langA" onchange="updateConfig()">
      <option value="en">🇺🇸 English</option>
      <option value="hi">🇮🇳 Hindi</option>
      <option value="es">🇪🇸 Spanish</option>
      <option value="fr">🇫🇷 French</option>
      <option value="de">🇩🇪 German</option>
      <option value="ja">🇯🇵 Japanese</option>
      <option value="zh">🇨🇳 Chinese</option>
      <option value="ar">🇸🇦 Arabic</option>
      <option value="pt">🇧🇷 Portuguese</option>
      <option value="ru">🇷🇺 Russian</option>
      <option value="it">🇮🇹 Italian</option>
      <option value="ko">🇰🇷 Korean</option>
    </select>
  </div>
  <div class="lang-arrow">⇄</div>
  <div class="speaker-lang">
    <div class="speaker-label b">👤 Person B</div>
    <select class="lang-select-pill b" id="langB" onchange="updateConfig()">
      <option value="hi">🇮🇳 Hindi</option>
      <option value="en">🇺🇸 English</option>
      <option value="es">🇪🇸 Spanish</option>
      <option value="fr">🇫🇷 French</option>
      <option value="de">🇩🇪 German</option>
      <option value="ja">🇯🇵 Japanese</option>
      <option value="zh">🇨🇳 Chinese</option>
      <option value="ar">🇸🇦 Arabic</option>
      <option value="pt">🇧🇷 Portuguese</option>
      <option value="ru">🇷🇺 Russian</option>
      <option value="it">🇮🇹 Italian</option>
      <option value="ko">🇰🇷 Korean</option>
    </select>
  </div>
</div>

<!-- Conversation Feed -->
<div class="convo-feed" id="feed">
  <div class="empty-convo" id="emptyConvo">
    <div class="empty-icon">💬</div>
    <div class="empty-title">Ready to translate</div>
    <div class="empty-sub">
      Select who is speaking, tap the mic,<br/>
      and have a natural conversation<br/>
      in any two languages.
    </div>
  </div>
</div>

<!-- Speaker Controls -->
<div class="speaker-controls">

  <!-- Speaker toggle -->
  <div class="speaker-toggle" id="speakerToggle" style="display:none">
    <button class="speaker-btn a active" id="btnA" onclick="setSpeaker('A')">
      <div class="spk-dot"></div>
      Person A Speaking
    </button>
    <button class="speaker-btn b" id="btnB" onclick="setSpeaker('B')">
      <div class="spk-dot"></div>
      Person B Speaking
    </button>
  </div>

  <!-- Mic area -->
  <div class="main-mic-area" id="micArea" style="display:none">
    <div class="vol-bars" id="volBars">
      <div class="vol-bar" id="vb1"></div>
      <div class="vol-bar" id="vb2"></div>
      <div class="vol-bar" id="vb3"></div>
      <div class="vol-bar" id="vb4"></div>
      <div class="vol-bar" id="vb5"></div>
      <div class="vol-bar" id="vb6"></div>
      <div class="vol-bar" id="vb7"></div>
      <div class="vol-bar" id="vb8"></div>
    </div>

    <div class="main-mic-wrap" id="micWrap">
      <div class="mic-ring mic-ring-1"></div>
      <div class="mic-ring mic-ring-2"></div>
      <div class="mic-ring mic-ring-3"></div>
      <button class="main-mic-btn" id="micBtn">🎙️</button>
    </div>

    <div class="status-pill" id="statusPill">
      <div class="pill-spin"></div>
      <span id="pillText">Processing...</span>
    </div>

    <div class="mic-status" id="micStatus">Listening for Person A...</div>
  </div>

  <!-- Start/Stop session -->
  <button class="session-btn start" id="sessionBtn" onclick="toggleSession()">
    🎙️ Start Conversation
  </button>
</div>

<script>
  let ws = null;
  let audioCtx = null;
  let processor = null;
  let source = null;
  let micStream = null;
  let analyser = null;
  let animFrame = null;
  let active = false;
  let activeSpeaker = 'A';
  let msgCount = 0;
  let audioStore = {};
  let currentTranscript = '';
  let volLevels = new Array(8).fill(3);

  const LANG_LABELS = {
    en:'English', hi:'Hindi', es:'Spanish', fr:'French',
    de:'German', ja:'Japanese', zh:'Chinese', ar:'Arabic',
    pt:'Portuguese', ru:'Russian', it:'Italian', ko:'Korean'
  };

  async function toggleSession() {
    if (!active) await startSession();
    else stopSession();
  }

  async function startSession() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      ws = new WebSocket(`ws://${location.host}/convo-ws`);
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => {
        updateConfig();
        console.log('Convo WS connected');
      };
      ws.onmessage = e => handleMsg(JSON.parse(e.data));
      ws.onerror = e => console.error('WS error', e);
      ws.onclose = () => { if(active) stopSession(); };

      audioCtx = new AudioContext({ sampleRate: 16000 });
      source = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);

      processor = audioCtx.createScriptProcessor(4096, 1, 1);
      source.connect(processor);
      processor.connect(audioCtx.destination);
      processor.onaudioprocess = e => {
        if (!active || !ws || ws.readyState !== 1) return;
        const f = e.inputBuffer.getChannelData(0);
        const i16 = new Int16Array(f.length);
        for (let i = 0; i < f.length; i++) i16[i] = Math.max(-32768, Math.min(32767, f[i] * 32768));
        ws.send(i16.buffer);
      };

      active = true;

      // Update UI
      document.getElementById('sessionBtn').className = 'session-btn stop';
      document.getElementById('sessionBtn').textContent = '⏹ End Conversation';
      document.getElementById('speakerToggle').style.display = 'grid';
      document.getElementById('micArea').style.display = 'flex';
      document.getElementById('emptyConvo').style.display = 'none';
      document.getElementById('liveDot').classList.add('live');
      document.getElementById('liveText').textContent = 'Live';
      setSpeaker('A');
      animVol();

    } catch(e) {
      alert('Microphone access denied. Please allow mic access.');
    }
  }

  function stopSession() {
    active = false;
    if(processor){processor.disconnect();processor=null;}
    if(source){source.disconnect();source=null;}
    if(audioCtx){audioCtx.close();audioCtx=null;}
    if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}
    if(ws&&ws.readyState===1)ws.close();
    if(animFrame)cancelAnimationFrame(animFrame);

    document.getElementById('sessionBtn').className = 'session-btn start';
    document.getElementById('sessionBtn').innerHTML = '🎙️ Start Conversation';
    document.getElementById('speakerToggle').style.display = 'none';
    document.getElementById('micArea').style.display = 'none';
    document.getElementById('liveDot').classList.remove('live');
    document.getElementById('liveText').textContent = 'Ready';
    for(let i=1;i<=8;i++) document.getElementById('vb'+i).style.height='3px';
  }

  function setSpeaker(sp) {
    activeSpeaker = sp;
    const btnA = document.getElementById('btnA');
    const btnB = document.getElementById('btnB');
    const micBtn = document.getElementById('micBtn');
    const micStatus = document.getElementById('micStatus');
    const micWrap = document.getElementById('micWrap');
    const rings = micWrap.querySelectorAll('.mic-ring');

    btnA.classList.toggle('active', sp === 'A');
    btnB.classList.toggle('active', sp === 'B');

    if(sp === 'A') {
      micBtn.className = 'main-mic-btn';
      micStatus.textContent = `Listening for Person A (${LANG_LABELS[document.getElementById('langA').value]})...`;
      micStatus.className = 'mic-status listening-a';
      rings.forEach(r => { r.classList.remove('b-ring-1','b-ring-2','b-ring-3'); });
    } else {
      micBtn.className = 'main-mic-btn b-mode';
      micStatus.textContent = `Listening for Person B (${LANG_LABELS[document.getElementById('langB').value]})...`;
      micStatus.className = 'mic-status listening-b';
    }

    if(ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ speaker: sp }));
    }
  }

  function handleMsg(msg) {
    switch(msg.type) {
      case 'volume':
        volLevels.shift();
        volLevels.push(msg.level);
        for(let i=1;i<=8;i++) {
          document.getElementById('vb'+i).style.height = Math.max(3, volLevels[i-1]*0.4)+'px';
          document.getElementById('vb'+i).style.background = msg.speaker === 'B' ? 'var(--b-color)' : 'var(--a-color)';
        }
        break;

      case 'speaking':
        const wrap = document.getElementById('micWrap');
        if(msg.status) {
          wrap.classList.add('pulsing');
          document.getElementById('micBtn').textContent = '🔴';
          document.getElementById('micBtn').classList.add('listening');
        } else {
          wrap.classList.remove('pulsing');
          document.getElementById('micBtn').textContent = '🎙️';
          document.getElementById('micBtn').classList.remove('listening');
        }
        break;

      case 'status':
        showPill(msg.message);
        break;

      case 'transcript':
        currentTranscript = msg.text;
        break;

      case 'translation':
        msgCount++;
        addMessage(msg);
        break;

      case 'audio':
        playAudio(msg.data, msg.id);
        hidePill();
        break;

      case 'ready':
        hidePill();
        break;

      case 'error':
        showPill('⚠️ ' + msg.message);
        setTimeout(hidePill, 3000);
        break;
    }
  }

  function addMessage(msg) {
    const feed = document.getElementById('feed');
    const time = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const sp = msg.speaker;
    const tgtLang = LANG_LABELS[msg.tgt_lang] || msg.tgt_lang;

    const wrap = document.createElement('div');
    wrap.className = `msg-wrap speaker-${sp.toLowerCase()}`;
    wrap.innerHTML = `
      <div class="msg-speaker-tag">Person ${sp} → ${tgtLang}</div>
      <div class="msg-bubble">
        <div class="msg-original">${currentTranscript || '...'}</div>
        <div class="msg-translation" id="trans${msg.id}">${msg.text}</div>
      </div>
      <div class="msg-meta">
        <span class="msg-engine">${msg.engine}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="msg-time">${time}</span>
          <button class="msg-replay" onclick="replayAudio(${msg.id})">▶</button>
        </div>
      </div>
    `;
    feed.appendChild(wrap);
    feed.scrollTop = feed.scrollHeight;
  }

  function playAudio(b64, id) {
    const bytes = atob(b64);
    const arr = new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr],{type:'audio/mpeg'}));
    audioStore[id] = url;
    new Audio(url).play();
  }

  function replayAudio(id) {
    if(audioStore[id]) new Audio(audioStore[id]).play();
  }

  function showPill(t) {
    document.getElementById('pillText').textContent = t;
    document.getElementById('statusPill').classList.add('show');
  }
  function hidePill() {
    document.getElementById('statusPill').classList.remove('show');
  }

  function updateConfig() {
    if(ws && ws.readyState === 1) {
      ws.send(JSON.stringify({
        lang_a: document.getElementById('langA').value,
        lang_b: document.getElementById('langB').value,
      }));
    }
  }

  function animVol() {
    if(!analyser) return;
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    const step = Math.floor(data.length/8);
    for(let i=1;i<=8;i++) {
      const val = data[(i-1)*step]/255;
      document.getElementById('vb'+i).style.height = Math.max(3,val*24)+'px';
    }
    animFrame = requestAnimationFrame(animVol);
  }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Yaply Convo — Live Two-Way Translation</title>
<link rel="icon" href="/static/yaply favicon.jpeg" type="image/jpeg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#1A8A72;--teal-s:rgba(26,138,114,0.1);--teal-m:rgba(26,138,114,0.2);
  --sky:#3A6BC8;--sky-s:rgba(58,107,200,0.1);--sky-m:rgba(58,107,200,0.2);
  --amber:#E8823A;--amber-s:rgba(232,130,58,0.1);
  --green:#28B06A;--green-s:rgba(40,176,106,0.1);
  --red:#D84C3E;--red-s:rgba(216,76,62,0.1);--red-m:rgba(216,76,62,0.18);
  --charcoal:#2C2B28;--stone:#C8C4B2;
  --bg:#F7F6F2;--bg2:#EFEDE8;--white:#FFFFFF;
  --border:rgba(200,196,178,0.35);--border-md:rgba(200,196,178,0.6);
  --text:#2C2B28;--muted:#6B6860;--muted2:#9B9890;
  /* Speaker colors */
  --a:#3A6BC8;--a-s:rgba(58,107,200,0.08);--a-m:rgba(58,107,200,0.16);
  --b:#1A8A72;--b-s:rgba(26,138,114,0.08);--b-m:rgba(26,138,114,0.16);
  --r:10px;--r-lg:16px;--r-xl:22px;
  --shadow:0 2px 12px rgba(44,43,40,0.06);
  --shadow-lg:0 12px 40px rgba(44,43,40,0.12);
}
html,body{
  font-family:'Inter',sans-serif;
  background:var(--bg);color:var(--text);
  height:100%;overflow:hidden;
}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;}

/* ── SUBTLE BG PATTERN ── */
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle at 20% 10%,rgba(58,107,200,0.04) 0%,transparent 50%),radial-gradient(circle at 80% 90%,rgba(26,138,114,0.04) 0%,transparent 50%);
  pointer-events:none;z-index:0;
}

/* ── HEADER ── */
.header{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 13px;
  padding-top:calc(env(safe-area-inset-top,0px) + 52px);
  background:rgba(255,255,255,0.97);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.header-left{display:flex;align-items:center;gap:8px;}
.hdr-back{
  width:32px;height:32px;border-radius:9px;
  background:var(--bg2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-decoration:none;transition:all .15s;
}
.hdr-back:hover{background:var(--border);} 
.hdr-back svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2;}
.hdr-logo-mark{width:28px;height:28px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;}
.hdr-logo-mark svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2;}
.hdr-title{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:800;color:var(--charcoal);}
.hdr-title span{color:var(--teal);}
.live-badge{
  display:flex;align-items:center;gap:6px;
  padding:4px 11px;border-radius:100px;
  font-size:.6rem;font-weight:700;letter-spacing:.5px;
  transition:all .3s;
}
.live-badge.offline{background:var(--bg2);border:1px solid var(--border);color:var(--muted2);}
.live-badge.online{background:var(--red-s);border:1px solid var(--red-m);color:var(--red);}
.lb-dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.lb-dot.pulse{animation:lbPulse 1s ease-in-out infinite;}
@keyframes lbPulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ── LANG STRIP ── */
.lang-strip{
  position:relative;z-index:9;
  display:grid;grid-template-columns:1fr auto 1fr;
  gap:10px;align-items:center;
  padding:11px 16px;
  background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.lang-side{display:flex;flex-direction:column;gap:4px;}
.lang-who{
  font-size:.58rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;display:flex;align-items:center;gap:5px;
}
.lw-a{color:var(--a);}
.lw-b{color:var(--b);}
.lang-who-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.lang-sel{
  -webkit-appearance:none;appearance:none;
  border-radius:8px;padding:6px 11px;
  font-family:'Inter',sans-serif;font-size:.75rem;font-weight:600;
  border:1.5px solid var(--border-md);background:var(--bg);
  color:var(--text);cursor:pointer;outline:none;transition:border-color .2s;
  width:100%;
}
.lang-sel.a:focus{border-color:var(--a);}
.lang-sel.b:focus{border-color:var(--b);}
.lang-mid{
  display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--border);
  cursor:pointer;transition:all .2s;flex-shrink:0;
}
.lang-mid:hover{background:var(--border);}
.lang-mid svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2;}

/* ── FEED ── */
.feed{
  flex:1;overflow-y:auto;
  padding:14px 14px;
  display:flex;flex-direction:column;gap:10px;
  scrollbar-width:none;position:relative;z-index:1;
}
.feed::-webkit-scrollbar{display:none;}

.feed-empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:40px 24px;
}
.fe-visual{
  position:relative;width:80px;height:80px;
  display:flex;align-items:center;justify-content:center;
}
.fe-bubble-a,.fe-bubble-b{
  position:absolute;border-radius:14px;
  border:1.5px solid;padding:8px 12px;
  font-size:.65rem;font-weight:600;white-space:nowrap;
}
.fe-bubble-a{background:var(--a-s);border-color:var(--a-m);color:var(--a);top:0;left:-10px;transform:rotate(-4deg);}
.fe-bubble-b{background:var(--b-s);border-color:var(--b-m);color:var(--b);bottom:0;right:-10px;transform:rotate(3deg);}
.fe-ico{
  width:40px;height:40px;border-radius:12px;
  background:var(--bg2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;z-index:1;
}
.fe-ico svg{width:18px;height:18px;stroke:var(--muted2);fill:none;stroke-width:1.5;}
.fe-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;color:var(--charcoal);}
.fe-sub{font-size:.72rem;color:var(--muted);line-height:1.7;max-width:240px;}

/* Message bubbles */
.msg-row{animation:msgIn .3s cubic-bezier(.22,1,.36,1);}
@keyframes msgIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.msg-row.a{align-self:flex-start;max-width:88%;}
.msg-row.b{align-self:flex-end;max-width:88%;}

.msg-who{
  font-size:.58rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:4px;padding:0 3px;
  display:flex;align-items:center;gap:5px;
}
.msg-row.a .msg-who{color:var(--a);}
.msg-row.b .msg-who{color:var(--b);flex-direction:row-reverse;}
.msg-who-dot{width:4px;height:4px;border-radius:50%;background:currentColor;}

.msg-bubble{
  border-radius:var(--r-lg);padding:11px 14px;
  position:relative;
}
.msg-row.a .msg-bubble{
  background:var(--a-s);border:1px solid var(--a-m);
  border-bottom-left-radius:4px;
}
.msg-row.b .msg-bubble{
  background:var(--b-s);border:1px solid var(--b-m);
  border-bottom-right-radius:4px;
}
.msg-orig{
  font-size:.72rem;color:var(--muted);font-style:italic;
  margin-bottom:6px;padding-bottom:6px;
  border-bottom:1px solid rgba(0,0,0,0.06);line-height:1.5;
}
.msg-trans{
  font-size:.88rem;font-weight:600;line-height:1.6;
}
.msg-row.a .msg-trans{color:var(--a);}
.msg-row.b .msg-trans{color:var(--b);}

.msg-footer{
  display:flex;align-items:center;gap:7px;margin-top:4px;padding:0 3px;
}
.msg-row.b .msg-footer{flex-direction:row-reverse;}
.msg-engine{font-size:.58rem;color:var(--muted2);}
.msg-time{font-size:.58rem;color:var(--muted2);}
.msg-replay{
  width:20px;height:20px;border-radius:50%;border:none;
  background:rgba(0,0,0,.06);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.msg-replay:hover{background:var(--teal);}
.msg-replay svg{width:8px;height:8px;fill:var(--muted);transition:fill .15s;}
.msg-replay:hover svg{fill:#fff;}

/* ── CONTROLS ── */
.controls{
  position:relative;z-index:10;
  background:rgba(255,255,255,0.97);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:14px 16px calc(env(safe-area-inset-bottom,16px) + 14px);
}

/* Speaker toggle */
.spk-toggle{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin-bottom:14px;
}
.spk-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:10px;border-radius:var(--r);
  border:1.5px solid var(--border);background:var(--bg);
  font-family:'Inter',sans-serif;font-size:.72rem;font-weight:700;
  color:var(--muted);cursor:pointer;transition:all .2s;
}
.spk-btn .sb-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.spk-btn.a.active{border-color:var(--a-m);background:var(--a-s);color:var(--a);}
.spk-btn.b.active{border-color:var(--b-m);background:var(--b-s);color:var(--b);}
.spk-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;}

/* Mic area */
.mic-area{
  display:flex;flex-direction:column;align-items:center;
  gap:10px;margin-bottom:12px;
}
.mic-vol{display:flex;align-items:flex-end;gap:2px;height:24px;}
.mvb{width:3px;border-radius:2px;background:var(--a);height:3px;transition:height .08s ease;}
.mic-col{display:flex;flex-direction:column;align-items:center;gap:7px;}

/* Mic ring wrap */
.mic-ring-wrap{position:relative;width:72px;height:72px;display:flex;align-items:center;justify-content:center;}
.mic-ripple{position:absolute;border-radius:50%;border:1.5px solid transparent;opacity:0;}
.mr1{width:52px;height:52px;}
.mr2{width:64px;height:64px;}
.mr3{width:72px;height:72px;}
/* Active ripples - A speaker */
.state-a-on .mr1{border-color:rgba(58,107,200,.6);animation:rp 1.8s 0s ease-out infinite;}
.state-a-on .mr2{border-color:rgba(58,107,200,.4);animation:rp 1.8s .4s ease-out infinite;}
.state-a-on .mr3{border-color:rgba(58,107,200,.2);animation:rp 1.8s .8s ease-out infinite;}
/* Active ripples - B speaker */
.state-b-on .mr1{border-color:rgba(26,138,114,.6);animation:rp 1.8s 0s ease-out infinite;}
.state-b-on .mr2{border-color:rgba(26,138,114,.4);animation:rp 1.8s .4s ease-out infinite;}
.state-b-on .mr3{border-color:rgba(26,138,114,.2);animation:rp 1.8s .8s ease-out infinite;}
/* Speaking fast */
.state-speaking .mr1{animation:rp .7s 0s ease-out infinite!important;}
.state-speaking .mr2{animation:rp .7s .2s ease-out infinite!important;}
.state-speaking .mr3{animation:rp .7s .4s ease-out infinite!important;}
@keyframes rp{0%{transform:scale(.7);opacity:.8;}100%{transform:scale(1.5);opacity:0;}}

/* Mic button */
.mic-btn{
  width:54px;height:54px;border-radius:50%;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;z-index:2;
}
.mic-btn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;transition:all .2s;}
.mic-btn.idle{background:linear-gradient(135deg,var(--a),#6AA8E8);box-shadow:0 6px 20px rgba(58,107,200,.3);}
.mic-btn.b-idle{background:linear-gradient(135deg,var(--b),#4ADE80);box-shadow:0 6px 20px rgba(26,138,114,.3);}
.mic-btn.speaking{background:linear-gradient(135deg,var(--red),#C43830);box-shadow:0 6px 24px rgba(216,76,62,.4);animation:micGlow .7s ease-in-out infinite alternate;}
@keyframes micGlow{from{box-shadow:0 6px 20px rgba(216,76,62,.35);}to{box-shadow:0 6px 36px rgba(216,76,62,.65);}}
.mic-btn:hover{transform:scale(1.07);}
.mic-btn:active{transform:scale(.95);}
/* Stop icon inside when speaking */
.mic-stop{display:none;width:18px;height:18px;border-radius:4px;background:white;}
.is-speaking .mic-stop{display:block;}
.is-speaking .mic-mic-ico{display:none;}

.mic-label{font-size:.7rem;font-weight:600;color:var(--muted);text-align:center;line-height:1.4;}
.mic-label.a-active{color:var(--a);}
.mic-label.b-active{color:var(--b);}

/* Processing pill */
.proc-pill{
  display:none;align-items:center;gap:6px;
  padding:4px 12px;border-radius:100px;
  background:var(--teal-s);border:1px solid var(--teal-m);
  font-size:.65rem;font-weight:600;color:var(--teal);
}
.proc-pill.show{display:flex;}
.pp-spin{width:10px;height:10px;border:1.5px solid rgba(26,138,114,.25);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Session button */
.sess-btn{
  width:100%;padding:12px;border-radius:var(--r);border:none;
  font-family:'Inter',sans-serif;font-size:.82rem;font-weight:700;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.sess-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
.sess-btn.start{background:var(--teal);color:#fff;box-shadow:0 6px 20px rgba(26,138,114,.25);}
.sess-btn.start:hover{background:#158068;transform:translateY(-1px);}
.sess-btn.stop{background:var(--red-s);border:1.5px solid var(--red-m);color:var(--red);}
.sess-btn.stop:hover{background:var(--red-m);}

/* Divider in feed */
.feed-divider{
  text-align:center;font-size:.6rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;
  color:var(--muted2);padding:6px 0;
  display:flex;align-items:center;gap:8px;
}
.feed-divider::before,.feed-divider::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── MODE TOGGLE ── */
.mode-toggle{
  display:flex;gap:0;
  border-radius:10px;overflow:hidden;
  border:1.5px solid var(--border);
  background:var(--bg);margin-bottom:12px;
}
.mode-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  padding:8px 10px;border:none;background:transparent;
  font-family:'Inter',sans-serif;font-size:.68rem;font-weight:700;
  color:var(--muted);cursor:pointer;transition:all .2s;
}
.mode-btn.active.fast{background:var(--teal-s);color:var(--teal);}
.mode-btn.active.advanced{background:rgba(139,92,246,.12);color:#8B5CF6;}
.mode-divider-line{width:1px;background:var(--border);flex-shrink:0;}
.mode-badge{
  display:inline-flex;align-items:center;gap:3px;
  padding:1px 6px;border-radius:100px;
  font-size:.55rem;font-weight:700;vertical-align:middle;
}
.mode-badge.fast{background:var(--teal-s);color:var(--teal);}
.mode-badge.advanced{background:rgba(139,92,246,.1);color:#8B5CF6;}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <a href="/app" class="hdr-back"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></a>
    <div class="hdr-logo-mark"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
    <div class="hdr-title">Yaply <span>Convo</span></div>
  </div>
  <div class="live-badge offline" id="liveBadge">
    <div class="lb-dot" id="lbDot"></div>
    <span id="lbTxt">READY</span>
  </div>
</div>

<!-- Language Strip -->
<div class="lang-strip">
  <div class="lang-side">
    <div class="lang-who lw-a"><div class="lang-who-dot"></div>Person A</div>
    <select class="lang-sel a" id="langA" onchange="updateConfig()">
      <option value="en">English</option><option value="hi">Hindi</option>
      <option value="es">Spanish</option><option value="fr">French</option>
      <option value="de">German</option><option value="ja">Japanese</option>
      <option value="zh">Chinese</option><option value="ar">Arabic</option>
      <option value="pt">Portuguese</option><option value="ru">Russian</option>
      <option value="it">Italian</option><option value="ko">Korean</option>
    </select>
  </div>
  <div class="lang-mid" onclick="swapLangs()">
    <svg viewBox="0 0 24 24"><polyline points="16 3 21 8 16 13"/><line x1="21" y1="8" x2="9" y2="8"/><polyline points="8 21 3 16 8 11"/><line x1="3" y1="16" x2="15" y2="16"/></svg>
  </div>
  <div class="lang-side" style="align-items:flex-end;">
    <div class="lang-who lw-b" style="flex-direction:row-reverse;"><div class="lang-who-dot"></div>Person B</div>
    <select class="lang-sel b" id="langB" onchange="updateConfig()">
      <option value="hi">Hindi</option><option value="en">English</option>
      <option value="es">Spanish</option><option value="fr">French</option>
      <option value="de">German</option><option value="ja">Japanese</option>
      <option value="zh">Chinese</option><option value="ar">Arabic</option>
      <option value="pt">Portuguese</option><option value="ru">Russian</option>
      <option value="it">Italian</option><option value="ko">Korean</option>
    </select>
  </div>
</div>

<!-- Feed -->
<div class="feed" id="feed">
  <div class="feed-empty" id="feedEmpty">
    <div class="fe-visual">
      <div class="fe-bubble-a">Hola!</div>
      <div class="fe-ico"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
      <div class="fe-bubble-b">नमस्ते!</div>
    </div>
    <div class="fe-title">Ready to translate</div>
    <div class="fe-sub">Select who's speaking, tap Start, and talk naturally. Each person's speech is translated for the other.</div>
  </div>
</div>

<!-- Controls -->
<div class="controls">

  <!-- Speaker toggle — hidden until session starts -->
  <div class="spk-toggle" id="spkToggle" style="display:none;">
    <button class="spk-btn a active" id="spkA" onclick="setSpeaker('A')">
      <div class="sb-dot"></div>
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Person A
    </button>
    <button class="spk-btn b" id="spkB" onclick="setSpeaker('B')">
      <div class="sb-dot"></div>
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Person B
    </button>
  </div>

  <!-- Mic area — hidden until session starts -->
  <div class="mic-area" id="micArea" style="display:none;">
    <!-- Vol bars top -->
    <div class="mic-vol" id="micVol">
      <div class="mvb" id="mb1"></div><div class="mvb" id="mb2"></div>
      <div class="mvb" id="mb3"></div><div class="mvb" id="mb4"></div>
      <div class="mvb" id="mb5"></div><div class="mvb" id="mb6"></div>
      <div class="mvb" id="mb7"></div><div class="mvb" id="mb8"></div>
    </div>

    <div class="mic-col">
      <div class="mic-ring-wrap" id="micRingWrap">
        <div class="mic-ripple mr1"></div>
        <div class="mic-ripple mr2"></div>
        <div class="mic-ripple mr3"></div>
        <button class="mic-btn idle" id="micBtn">
          <span class="mic-mic-ico">
            <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </span>
          <div class="mic-stop"></div>
        </button>
      </div>
      <div class="proc-pill" id="procPill"><div class="pp-spin"></div><span id="procTxt">Processing...</span></div>
      <div class="mic-label" id="micLabel">Listening for Person A...</div>
    </div>
  </div>

  <!-- Mode toggle -->
  <div class="mode-toggle">
    <button class="mode-btn fast active" id="modeF" onclick="setMode('fast')">
      ⚡ Fast
      <span style="font-size:.58rem;font-weight:400;opacity:.7;">Turbo</span>
    </button>
    <div class="mode-divider-line"></div>
    <button class="mode-btn advanced" id="modeA" onclick="setMode('advanced')">
      ✦ Advanced
      <span style="font-size:.58rem;font-weight:400;opacity:.7;">Precise</span>
    </button>
  </div>

  <!-- Session button -->
  <button class="sess-btn start" id="sessBtn" onclick="toggleSession()">
    <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
    Start Conversation
  </button>
</div>

<script src="/static/yaply-nav.js"></script>
<script>
const LANGS = {
  en:'English',hi:'Hindi',es:'Spanish',fr:'French',
  de:'German',ja:'Japanese',zh:'Chinese',ar:'Arabic',
  pt:'Portuguese',ru:'Russian',it:'Italian',ko:'Korean'
};

let ws=null,audioCtx=null,processor=null,source=null,micStream=null,analyser=null;
let animFrame=null,active=false,activeSpeaker='A';
let msgCount=0,audioStore={},currentTranscript='';
let volHist = new Array(8).fill(3);
let currentMode = 'fast';

// ── SESSION ──
async function toggleSession() {
  if (!active) await startSession(); else stopSession();
}

async function startSession() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/convo-ws`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { updateConfig(); setMode(currentMode, true); };
    ws.onmessage = e => handle(JSON.parse(e.data));
    ws.onerror = () => showPill('Connection error');
    ws.onclose = () => { if(active) stopSession(); };

    audioCtx = new AudioContext({ sampleRate:16000 });
    source = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
    source.connect(analyser);

    processor = audioCtx.createScriptProcessor(4096,1,1);
    source.connect(processor);
    processor.connect(audioCtx.destination);
    processor.onaudioprocess = e => {
      if (!active || !ws || ws.readyState !== 1) return;
      const f = e.inputBuffer.getChannelData(0);
      const i16 = new Int16Array(f.length);
      for (let i=0; i<f.length; i++) i16[i] = Math.max(-32768, Math.min(32767, f[i]*32768));
      ws.send(i16.buffer);
    };

    active = true;
    setOnUI();
    setSpeaker('A');
    animVol();
  } catch(e) {
    alert('Microphone access denied. Please allow mic access.');
  }
}

function stopSession() {
  active = false;
  if(processor){processor.disconnect();processor=null;}
  if(source){source.disconnect();source=null;}
  if(audioCtx){audioCtx.close();audioCtx=null;}
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}
  if(ws?.readyState===1) ws.close();
  if(animFrame) cancelAnimationFrame(animFrame);
  setOffUI();
  for(let i=1;i<=8;i++) document.getElementById('mb'+i).style.height='3px';
}

function setOnUI() {
  document.getElementById('sessBtn').className = 'sess-btn stop';
  document.getElementById('sessBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="4" y="4" width="16" height="16" rx="2"/></svg> End Conversation';
  document.getElementById('spkToggle').style.display = 'grid';
  document.getElementById('micArea').style.display = 'flex';
  document.getElementById('feedEmpty').style.display = 'none';
  document.getElementById('liveBadge').className = 'live-badge online';
  document.getElementById('lbDot').className = 'lb-dot pulse';
  document.getElementById('lbTxt').textContent = currentMode==='advanced' ? 'LIVE ✦' : 'LIVE ⚡';
  addDivider('Session started');
}

function setOffUI() {
  document.getElementById('sessBtn').className = 'sess-btn start';
  document.getElementById('sessBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg> Start Conversation';
  document.getElementById('spkToggle').style.display = 'none';
  document.getElementById('micArea').style.display = 'none';
  document.getElementById('liveBadge').className = 'live-badge offline';
  document.getElementById('lbDot').className = 'lb-dot';
  document.getElementById('lbTxt').textContent = 'READY';
  hidePill();
  addDivider('Session ended');
}

// ── SPEAKER ──
function setSpeaker(sp) {
  activeSpeaker = sp;
  const wrap = document.getElementById('micRingWrap');
  const btn = document.getElementById('micBtn');
  const lbl = document.getElementById('micLabel');
  const vbars = document.querySelectorAll('.mvb');

  document.getElementById('spkA').className = 'spk-btn a' + (sp==='A'?' active':'');
  document.getElementById('spkB').className = 'spk-btn b' + (sp==='B'?' active':'');

  wrap.className = 'mic-ring-wrap state-' + sp.toLowerCase() + '-on';
  const langVal = document.getElementById('lang'+sp).value;
  const langName = LANGS[langVal] || langVal;

  if (sp === 'A') {
    btn.className = 'mic-btn idle';
    lbl.className = 'mic-label a-active';
    vbars.forEach(b => b.style.background = 'var(--a)');
  } else {
    btn.className = 'mic-btn b-idle';
    lbl.className = 'mic-label b-active';
    vbars.forEach(b => b.style.background = 'var(--b)');
  }
  lbl.textContent = `Listening for Person ${sp} (${langName})...`;

  if(ws?.readyState===1) ws.send(JSON.stringify({ speaker:sp }));
}

// ── HANDLE WS ──
function handle(msg) {
  switch(msg.type) {
    case 'volume':
      volHist.shift(); volHist.push(msg.level);
      for(let i=1;i<=8;i++) {
        document.getElementById('mb'+i).style.height = Math.max(3, volHist[i-1]*0.4)+'px';
      }
      break;
    case 'speaking':
      const wrap = document.getElementById('micRingWrap');
      const btn = document.getElementById('micBtn');
      if(msg.status) {
        wrap.className = 'mic-ring-wrap state-speaking';
        btn.className = 'mic-btn speaking is-speaking';
      } else {
        wrap.className = 'mic-ring-wrap state-' + activeSpeaker.toLowerCase() + '-on';
        btn.className = activeSpeaker==='A' ? 'mic-btn idle' : 'mic-btn b-idle';
      }
      break;
    case 'status': showPill(msg.message); break;
    case 'transcript': currentTranscript = msg.text; break;
    case 'translation':
      msgCount++;
      addMessage(msg);
      break;
    case 'audio':
      playAudio(msg.data, msg.id);
      hidePill();
      break;
    case 'ready': hidePill(); break;
    case 'mode_ack':
      currentMode = msg.mode;
      document.getElementById('modeF').className = 'mode-btn fast' + (msg.mode==='fast'?' active':'');
      document.getElementById('modeA').className = 'mode-btn advanced' + (msg.mode==='advanced'?' active':'');
      if(active) document.getElementById('lbTxt').textContent = msg.mode==='advanced' ? 'LIVE ✦' : 'LIVE ⚡';
      break;
    case 'error':
      showPill('⚠ ' + msg.message);
      setTimeout(hidePill, 3000);
      break;
  }
}

// ── MESSAGES ──
function addMessage(msg) {
  const feed = document.getElementById('feed');
  const sp = (msg.speaker || activeSpeaker).toUpperCase();
  const tgtLang = LANGS[msg.tgt_lang] || msg.tgt_lang || '—';
  const time = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  const row = document.createElement('div');
  row.className = 'msg-row ' + sp.toLowerCase();
  row.innerHTML = `
    <div class="msg-who"><div class="msg-who-dot"></div>Person ${sp} → ${tgtLang}</div>
    <div class="msg-bubble">
      ${currentTranscript ? `<div class="msg-orig">${currentTranscript}</div>` : ''}
      <div class="msg-trans" id="mt-${msg.id}">${msg.text || '...'}</div>
    </div>
    <div class="msg-footer">
      <span class="msg-engine">${msg.engine||'AI'}</span>
      <span class="mode-badge ${msg.mode||currentMode}">${msg.mode==='advanced'?'✦ Adv':'⚡ Fast'}</span>
      <span class="msg-time">${time}</span>
      <button class="msg-replay" onclick="replayAudio(${msg.id})" title="Replay">
        <svg viewBox="0 0 24 24" fill="currentColor" width="8" height="8"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
    </div>
  `;
  feed.appendChild(row);
  feed.scrollTop = feed.scrollHeight;
  currentTranscript = '';
}

function addDivider(label) {
  const feed = document.getElementById('feed');
  const div = document.createElement('div');
  div.className = 'feed-divider';
  div.textContent = label;
  feed.appendChild(div);
}

// ── AUDIO ──
function playAudio(b64, id) {
  try {
    const bytes = atob(b64);
    const arr = new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr],{type:'audio/mpeg'}));
    audioStore[id] = url;
    new Audio(url).play();
  } catch(e){}
}

function replayAudio(id) {
  if(audioStore[id]) new Audio(audioStore[id]).play();
}

// ── PILL ──
function showPill(t) {
  document.getElementById('procTxt').textContent = t;
  document.getElementById('procPill').classList.add('show');
}
function hidePill() { document.getElementById('procPill').classList.remove('show'); }

// ── MODE ──
function setMode(m, silent) {
  currentMode = m;
  document.getElementById('modeF').className = 'mode-btn fast' + (m==='fast'?' active':'');
  document.getElementById('modeA').className = 'mode-btn advanced' + (m==='advanced'?' active':'');
  if(ws?.readyState===1) ws.send(JSON.stringify({ mode:m }));
  if(!silent && active) showPill(m==='advanced' ? '✦ Switched to Advanced' : '⚡ Switched to Fast');
  if(!silent) setTimeout(hidePill, 1800);
}

// ── CONFIG ──
function updateConfig() {
  if(ws?.readyState===1) {
    ws.send(JSON.stringify({ lang_a:document.getElementById('langA').value, lang_b:document.getElementById('langB').value }));
  }
}

function swapLangs() {
  const a = document.getElementById('langA');
  const b = document.getElementById('langB');
  const tmp = a.value; a.value = b.value; b.value = tmp;
  updateConfig();
  if(active) setSpeaker(activeSpeaker);
}

// ── VOL ANIMATION ──
function animVol() {
  if(!analyser) return;
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  const step = Math.floor(data.length/8);
  for(let i=1;i<=8;i++) {
    const val = data[(i-1)*step]/255;
    document.getElementById('mb'+i).style.height = Math.max(3, val*22)+'px';
  }
  animFrame = requestAnimationFrame(animVol);
}
</script>
</body>
</html>

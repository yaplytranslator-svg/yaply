<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Yaply — Travel Diary</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="/static/yaply-core.js"></script>

<style>
:root {
  --teal:    #1A8A72;
  --teal-d:  #0d6b57;
  --teal-l:  rgba(26,138,114,0.1);
  --teal-m:  rgba(26,138,114,0.2);
  --coral:   #E8673A;
  --coral-l: rgba(232,103,58,0.1);
  --gold:    #C49A3C;
  --gold-l:  rgba(196,154,60,0.12);
  --ink:     #1C1A17;
  --ink2:    #3D3A34;
  --ink3:    #7A776E;
  --paper:   #FAF8F4;
  --paper2:  #F2EFE8;
  --paper3:  #E8E4DA;
  --white:   #FFFFFF;
  --border:  rgba(60,55,45,0.1);
  --border2: rgba(60,55,45,0.18);
  --shadow:  0 2px 16px rgba(28,26,23,0.07);
  --shadow-lg: 0 12px 48px rgba(28,26,23,0.12);
  --r: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Grain texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.6;
}

/* ── HEADER ── */
.header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.92);
}

.header-left { display: flex; align-items: center; gap: 10px; }

.back-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  border-radius: 8px;
  border: none;
  background: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink3);
  cursor: pointer;
  transition: all .15s;
  text-decoration: none;
}
.back-btn:hover { background: var(--paper2); color: var(--ink); }
.back-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

.header-title {
  font-family: 'Lora', serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.3px;
}

.header-right { display: flex; gap: 6px; }

.hdr-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 13px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink3);
  cursor: pointer;
  transition: all .2s;
}
.hdr-btn:hover { background: var(--paper2); color: var(--ink); border-color: var(--border2); }
.hdr-btn.primary { background: var(--teal); color: white; border-color: var(--teal); }
.hdr-btn.primary:hover { background: var(--teal-d); border-color: var(--teal-d); }
.hdr-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ── APP ── */
.app { max-width: 480px; margin: 0 auto; padding-bottom: 100px; }

/* ── DIARY HERO ── */
.diary-hero {
  margin: 20px 20px 0;
  background: linear-gradient(135deg, #1A8A72 0%, #0d6b57 100%);
  border-radius: var(--r-xl);
  padding: 24px;
  position: relative;
  overflow: hidden;
}

.diary-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 18px,
    rgba(255,255,255,0.03) 18px,
    rgba(255,255,255,0.03) 19px
  );
}

.diary-hero::after {
  content: '';
  position: absolute;
  bottom: -40px;
  right: -40px;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
}

.hero-eyebrow {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  margin-bottom: 8px;
  position: relative;
}

.hero-title {
  font-family: 'Lora', serif;
  font-style: italic;
  font-size: 26px;
  font-weight: 400;
  color: white;
  letter-spacing: -0.5px;
  line-height: 1.2;
  margin-bottom: 16px;
  position: relative;
}

.hero-stats {
  display: flex;
  gap: 16px;
  position: relative;
}

.hero-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.hero-stat-val {
  font-family: 'Lora', serif;
  font-size: 22px;
  font-weight: 600;
  color: white;
  line-height: 1;
}

.hero-stat-label {
  font-size: 10px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.hero-stat-divider {
  width: 1px;
  background: rgba(255,255,255,0.15);
  align-self: stretch;
  margin: 2px 0;
}

/* ── MOOD STRIP ── */
.mood-strip {
  margin: 14px 20px 0;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.mood-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink3);
}

.mood-pills {
  display: flex;
  gap: 5px;
}

.mood-pill {
  padding: 5px 10px;
  border-radius: 100px;
  border: 1.5px solid var(--border2);
  background: none;
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.mood-pill:hover { transform: scale(1.1); border-color: var(--teal); }
.mood-pill.active { background: var(--teal-l); border-color: var(--teal); transform: scale(1.1); }

/* ── NEW ENTRY COMPOSER ── */
.composer {
  margin: 14px 20px 0;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: all .3s;
}

.composer:focus-within {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(26,138,114,0.1), var(--shadow);
}

.composer-top {
  padding: 14px 16px 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.composer-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--teal), var(--teal-d));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  color: white;
  font-family: 'Lora', serif;
  font-style: italic;
  font-weight: 600;
}

.composer-meta { flex: 1; }
.composer-name { font-size: 13px; font-weight: 600; color: var(--ink); }
.composer-date { font-size: 11px; color: var(--ink3); margin-top: 1px; }

.composer-location {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  border-radius: 100px;
  border: 1px solid var(--border2);
  background: var(--paper2);
  font-size: 11px;
  font-weight: 500;
  color: var(--ink3);
  cursor: pointer;
  transition: all .2s;
}
.composer-location:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-l); }
.composer-location svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; }

/* Textarea */
.composer-textarea {
  width: 100%;
  padding: 12px 16px;
  border: none;
  outline: none;
  resize: none;
  font-family: 'Lora', serif;
  font-size: 15px;
  font-style: italic;
  color: var(--ink);
  background: transparent;
  line-height: 1.7;
  min-height: 90px;
}
.composer-textarea::placeholder {
  color: var(--ink3);
  opacity: 0.6;
  font-style: italic;
}

/* Attachments row */
.composer-attach {
  padding: 0 16px 8px;
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.attach-preview {
  position: relative;
  width: 64px;
  height: 64px;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  animation: popIn .25s cubic-bezier(.34,1.56,.64,1) both;
}

.attach-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.attach-remove {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(28,26,23,0.7);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: white;
  font-size: 10px;
  line-height: 1;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.7); }
  to   { opacity: 1; transform: scale(1); }
}

/* Tag chips */
.composer-tags {
  padding: 0 16px 10px;
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.entry-tag {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid;
  cursor: pointer;
  transition: all .15s;
  background: none;
  font-family: 'DM Sans', sans-serif;
}
.entry-tag:hover { opacity: 0.8; }
.entry-tag.food    { color: var(--coral); border-color: rgba(232,103,58,0.3); background: var(--coral-l); }
.entry-tag.place   { color: var(--teal);  border-color: var(--teal-m);        background: var(--teal-l); }
.entry-tag.expense { color: var(--gold);  border-color: rgba(196,154,60,0.3); background: var(--gold-l); }
.entry-tag.memory  { color: #8B5CF6;      border-color: rgba(139,92,246,0.2); background: rgba(139,92,246,0.08); }
.entry-tag.feeling { color: #E8823A;      border-color: rgba(232,130,58,0.2); background: rgba(232,130,58,0.08); }

.tag-remove { font-size: 12px; opacity: 0.6; }

/* Composer toolbar */
.composer-toolbar {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 4px;
}

.toolbar-btn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: none;
  background: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .15s;
  color: var(--ink3);
  position: relative;
}
.toolbar-btn:hover { background: var(--paper2); color: var(--teal); }
.toolbar-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }

.toolbar-sep { flex: 1; }

.type-selector {
  display: flex;
  background: var(--paper2);
  border-radius: 8px;
  padding: 2px;
  gap: 2px;
  margin-right: 4px;
}

.type-btn {
  padding: 4px 9px;
  border-radius: 6px;
  border: none;
  background: none;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink3);
  cursor: pointer;
  transition: all .15s;
  font-family: 'DM Sans', sans-serif;
}
.type-btn.active { background: white; color: var(--teal); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

.save-entry-btn {
  padding: 7px 16px;
  border-radius: 8px;
  border: none;
  background: var(--teal);
  color: white;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.save-entry-btn:hover { background: var(--teal-d); transform: translateY(-1px); }
.save-entry-btn:active { transform: scale(0.97); }
.save-entry-btn svg { width: 12px; height: 12px; stroke: white; fill: none; stroke-width: 2; }

/* ── FILTER BAR ── */
.filter-bar {
  margin: 16px 20px 0;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.filter-bar::-webkit-scrollbar { display: none; }

.filter-chip {
  flex-shrink: 0;
  padding: 6px 13px;
  border-radius: 100px;
  border: 1.5px solid var(--border2);
  background: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink3);
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.filter-chip:hover { border-color: var(--teal); color: var(--teal); }
.filter-chip.active { background: var(--teal); border-color: var(--teal); color: white; }

/* ── TIMELINE ── */
.timeline {
  padding: 20px 20px 0;
  position: relative;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 35px;
  top: 20px;
  bottom: 0;
  width: 1.5px;
  background: linear-gradient(to bottom, var(--teal-m), transparent);
}

/* Day group */
.day-group { margin-bottom: 28px; }

.day-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  position: relative;
}

.day-circle {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--teal);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: white;
  flex-shrink: 0;
  z-index: 1;
  box-shadow: 0 0 0 4px var(--paper);
}

.day-text {
  font-family: 'Lora', serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
}

.day-sub {
  font-size: 11px;
  color: var(--ink3);
  margin-left: 2px;
}

/* Entry card */
.entry-card {
  margin-left: 46px;
  margin-bottom: 10px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow);
  animation: slideIn .35s cubic-bezier(.4,0,.2,1) both;
  transition: all .2s;
  position: relative;
}

.entry-card:hover {
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* Entry type stripe */
.entry-stripe {
  height: 3px;
  width: 100%;
}
.stripe-note    { background: linear-gradient(90deg, var(--teal), #34d399); }
.stripe-food    { background: linear-gradient(90deg, var(--coral), #f97316); }
.stripe-expense { background: linear-gradient(90deg, var(--gold), #f59e0b); }
.stripe-place   { background: linear-gradient(90deg, #3A6BC8, #818cf8); }
.stripe-memory  { background: linear-gradient(90deg, #8B5CF6, #a78bfa); }

/* Entry header */
.entry-header {
  padding: 12px 14px 8px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.entry-type-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}

.icon-note    { background: var(--teal-l); }
.icon-food    { background: var(--coral-l); }
.icon-expense { background: var(--gold-l); }
.icon-place   { background: rgba(58,107,200,0.1); }
.icon-memory  { background: rgba(139,92,246,0.1); }

.entry-meta { flex: 1; }
.entry-time { font-size: 10px; color: var(--ink3); margin-bottom: 2px; }
.entry-location-tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  color: var(--teal);
  font-weight: 500;
}
.entry-location-tag svg { width: 9px; height: 9px; stroke: currentColor; fill: none; stroke-width: 2; }

.entry-mood-emoji { font-size: 16px; }

/* Entry content */
.entry-content {
  padding: 0 14px 12px;
}

.entry-text {
  font-family: 'Lora', serif;
  font-size: 14px;
  font-style: italic;
  color: var(--ink2);
  line-height: 1.75;
  margin-bottom: 10px;
}

/* Photo grid */
.photo-grid {
  display: grid;
  gap: 4px;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
}
.photo-grid.grid-1 { grid-template-columns: 1fr; }
.photo-grid.grid-2 { grid-template-columns: 1fr 1fr; }
.photo-grid.grid-3 { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; }
.photo-grid.grid-3 .photo-item:first-child { grid-row: span 2; }

.photo-item {
  background: var(--paper2);
  aspect-ratio: 1;
  overflow: hidden;
  cursor: pointer;
  position: relative;
}
.photo-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
.photo-item:hover img { transform: scale(1.04); }

/* Tags in entry */
.entry-tags {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

/* Expense display */
.expense-display {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--gold-l);
  border: 1px solid rgba(196,154,60,0.2);
  border-radius: 10px;
  padding: 10px 13px;
  margin-bottom: 10px;
}
.expense-category { font-size: 11px; color: var(--ink3); }
.expense-amount {
  font-family: 'Lora', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--gold);
}
.expense-currency { font-size: 12px; color: var(--ink3); }

/* Entry actions */
.entry-actions {
  padding: 8px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 4px;
}

.entry-action-btn {
  flex: 1;
  padding: 6px;
  border-radius: 7px;
  border: none;
  background: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink3);
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.entry-action-btn:hover { background: var(--paper2); color: var(--teal); }
.entry-action-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
.entry-action-btn.liked { color: var(--coral); }

/* ── EXPENSE SUMMARY CARD ── */
.expense-summary {
  margin: 0 20px 14px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.exp-sum-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.exp-sum-title {
  font-family: 'Lora', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}

.exp-sum-total {
  font-family: 'Lora', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--teal);
}

.exp-categories {
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.exp-cat-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.exp-cat-icon { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; }
.exp-cat-name { font-size: 13px; color: var(--ink2); flex: 1; }
.exp-cat-bar-wrap { width: 80px; height: 4px; background: var(--paper3); border-radius: 2px; overflow: hidden; }
.exp-cat-bar { height: 100%; border-radius: 2px; transition: width 1s cubic-bezier(.4,0,.2,1); }
.exp-cat-amt { font-size: 12px; font-weight: 600; color: var(--ink); width: 55px; text-align: right; }

/* ── SEARCH BAR ── */
.search-wrap {
  margin: 14px 20px 0;
  position: relative;
}
.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  stroke: var(--ink3);
  fill: none;
  stroke-width: 2;
}
.search-input {
  width: 100%;
  padding: 10px 12px 10px 36px;
  background: var(--white);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--ink);
  outline: none;
  transition: all .2s;
}
.search-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-l); }
.search-input::placeholder { color: var(--ink3); }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  margin-left: 46px;
}
.empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; display: block; }
.empty-title {
  font-family: 'Lora', serif;
  font-style: italic;
  font-size: 18px;
  color: var(--ink3);
  margin-bottom: 6px;
}
.empty-sub { font-size: 13px; color: var(--ink3); opacity: 0.7; line-height: 1.6; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 10px 0 20px;
  z-index: 100;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  transition: opacity .2s;
}
.nav-item:not(.active) { opacity: 0.4; }
.nav-icon { font-size: 20px; }
.nav-label { font-size: 9px; font-weight: 500; color: var(--ink2); letter-spacing: 0.5px; text-transform: uppercase; }

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: 84px;
  right: calc(50% - 240px + 20px);
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--teal);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(26,138,114,0.4);
  transition: all .25s cubic-bezier(.34,1.56,.64,1);
  z-index: 99;
}
.fab:hover { transform: scale(1.1) rotate(45deg); box-shadow: 0 8px 28px rgba(26,138,114,0.5); }
.fab svg { width: 22px; height: 22px; stroke: white; fill: none; stroke-width: 2; }

@media(max-width:480px) { .fab { right: 20px; } }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 88px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--ink);
  color: white;
  padding: 9px 18px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: all .3s;
  z-index: 500;
  white-space: nowrap;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── MODAL ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(28,26,23,0.5);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}
.modal-overlay.show { opacity: 1; pointer-events: all; }

.modal-sheet {
  background: var(--white);
  border-radius: 24px 24px 0 0;
  padding: 20px 20px 40px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform .4s cubic-bezier(.34,1.2,.64,1);
}
.modal-overlay.show .modal-sheet { transform: translateY(0); }

.modal-handle {
  width: 36px;
  height: 4px;
  background: var(--paper3);
  border-radius: 2px;
  margin: 0 auto 20px;
}

.modal-title {
  font-family: 'Lora', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 16px;
  letter-spacing: -0.3px;
}

/* Location picker */
.location-list { display: flex; flex-direction: column; gap: 6px; }
.location-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 13px;
  background: var(--paper2);
  border-radius: var(--r);
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all .2s;
}
.location-item:hover { border-color: var(--teal); background: var(--teal-l); }
.location-icon { font-size: 18px; }
.location-name { font-size: 14px; font-weight: 500; }
.location-sub  { font-size: 11px; color: var(--ink3); margin-top: 1px; }

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.au { animation: fadeUp .4s cubic-bezier(.4,0,.2,1) both; }
.d1 { animation-delay: .05s; }
.d2 { animation-delay: .1s; }
.d3 { animation-delay: .15s; }
.d4 { animation-delay: .2s; }
.d5 { animation-delay: .25s; }

/* Hidden file input */
#photoInput { display: none; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <a href="/app" class="back-btn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </a>
    <div class="header-title">Travel Diary</div>
  </div>
  <div class="header-right">
    <button class="hdr-btn" onclick="openExportModal()">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
    </button>
    <button class="hdr-btn primary" onclick="scrollToComposer()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

    </button>
  </div>
</div>

<div class="app">

  <!-- Diary Hero -->
  <div class="diary-hero au">
    <div class="hero-eyebrow">✈️ My Travel Diary</div>
    <div class="hero-title" id="heroDest">Tokyo, Japan</div>
    <div class="hero-stats">
      <div class="hero-stat">
        <div class="hero-stat-val" id="heroEntries">0</div>
        <div class="hero-stat-label">Entries</div>
      </div>
      <div class="hero-stat-divider"></div>
      <div class="hero-stat">
        <div class="hero-stat-val" id="heroDay">Day 1</div>
        <div class="hero-stat-label">of Trip</div>
      </div>
      <div class="hero-stat-divider"></div>
      <div class="hero-stat">
        <div class="hero-stat-val" id="heroSpent">₹0</div>
        <div class="hero-stat-label">Spent</div>
      </div>
    </div>
  </div>

  <!-- Mood strip -->
  <div class="mood-strip au d1">
    <span class="mood-label">How are you feeling?</span>
    <div class="mood-pills">
      <button class="mood-pill" onclick="setMood(this,'😊')">😊</button>
      <button class="mood-pill" onclick="setMood(this,'🤩')">🤩</button>
      <button class="mood-pill" onclick="setMood(this,'😌')">😌</button>
      <button class="mood-pill" onclick="setMood(this,'😴')">😴</button>
      <button class="mood-pill" onclick="setMood(this,'😤')">😤</button>
    </div>
  </div>

  <!-- Composer -->
  <div class="composer au d2" id="composer">
    <div class="composer-top">
      <div class="composer-avatar" id="avatarLetter">P</div>
      <div class="composer-meta">
        <div class="composer-name">Piyush</div>
        <div class="composer-date" id="composerDate"></div>
      </div>
      <button class="composer-location" onclick="openLocationModal()">
        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="selectedLocation">Add location</span>

    <textarea

    <!-- Photo previews -->
    <div class="composer-attach" id="photoPreview"></div>

    <!-- Active tags -->
    <div class="composer-tags" id="activeTags"></div>

    <!-- Type selector + toolbar -->
    <div class="composer-toolbar">
      <div class="type-selector">

        <button class="type-btn" onclick="setType(this,'food')">Food</button>
        <button class="type-btn" onclick="setType(this,'expense')">₹</button>
        <button class="type-btn" onclick="setType(this,'place')">Place</button>
        <button class="type-btn" onclick="setType(this,'memory')">Memory</button>
      </div>

      <!-- Expense amount (shown only for expense type) -->
      <input
        type="number"
        id="expenseAmount"
        placeholder="Amount"
        style="display:none;width:80px;padding:6px 8px;border:1px solid var(--border2);border-radius:7px;font-size:12px;outline:none;font-family:'DM Sans',sans-serif;"
        oninput="updateExpenseDisplay()"
      />

      <div class="toolbar-sep"></div>

      <button class="toolbar-btn" onclick="document.getElementById('photoInput').click()" title="Add photo">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>

      <button class="save-entry-btn" onclick="saveEntry()">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Save
      </button>
    </div>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotos(this)"/>

  <!-- Expense Summary -->
  <div class="expense-summary au d3" id="expenseSummary" style="display:none;">
    <div class="exp-sum-header">
      <div class="exp-sum-title">💰 Trip Expenses</div>
      <div class="exp-sum-total" id="expTotal">₹0</div>
    </div>
    <div class="exp-categories" id="expCategories"></div>
  </div>

  <!-- Search -->
  <div class="search-wrap au d3">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" type="text" placeholder="Search your diary…" oninput="searchEntries(this.value)"/>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar au d4">
    <button class="filter-chip active" onclick="filterEntries(this,'all')">All</button>
    <button class="filter-chip" onclick="filterEntries(this,'note')">📝 Notes</button>
    <button class="filter-chip" onclick="filterEntries(this,'food')">🍜 Food</button>
    <button class="filter-chip" onclick="filterEntries(this,'expense')">💰 Expenses</button>
    <button class="filter-chip" onclick="filterEntries(this,'place')">📍 Places</button>
    <button class="filter-chip" onclick="filterEntries(this,'memory')">✨ Memories</button>
  </div>

  <!-- Timeline -->
  <div class="timeline au d5" id="timeline">
    <div class="empty-state" id="emptyState">
      <span class="empty-icon">📖</span>
      <div class="empty-title">Your diary awaits.</div>
      <div class="empty-sub">Start writing your first entry above.<br/>Every moment worth remembering.</div>

  </div>

</div>

<!-- FAB -->
<button class="fab" onclick="scrollToComposer()" title="New entry">
  <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- Bottom nav -->
<div class="bottom-nav">
  <div class="nav-item"><div class="nav-icon">✈️</div><div class="nav-label">Plan</div></div>
  <div class="nav-item"><div class="nav-icon">🎙️</div><div class="nav-label">Translate</div></div>
  <div class="nav-item active"><div class="nav-icon">📖</div><div class="nav-label">Diary</div></div>
  <div class="nav-item"><div class="nav-icon">💰</div><div class="nav-label">Expenses</div></div>
  <div class="nav-item"><div class="nav-icon">👤</div><div class="nav-label">Profile</div></div>
</div>

<!-- Location modal -->
<div class="modal-overlay" id="locationModal" onclick="closeLocationModal(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">📍 Where are you?</div>
    <div class="location-list" id="locationList"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────────────
var entries      = JSON.parse(localStorage.getItem('yaply_diary') || '[]');
var currentMood  = '😊';
var currentType  = 'note';
var currentLoc   = '';
var pendingPhotos = [];
var activeFilter = 'all';
var searchQuery  = '';
var tripStart    = new Date('2025-06-15');
var tripDest     = 'Tokyo, Japan';

// ── INIT ──────────────────────────────────────────────
window.addEventListener('load', function() {
  setComposerDate();
  renderTimeline();
  updateHeroStats();
  updateExpenseSummary();
  loadSampleEntries();
});

function loadSampleEntries() {
  if (entries.length > 0) return;
  // Sample entries to show the UI
  var samples = [
    {
      id: 1,
      type: 'memory',
      text: 'Watched the sunrise over Shibuya crossing. Completely empty at 5am — just me and the city waking up. I cried a little, not gonna lie.',
      mood: '🤩',
      location: 'Shibuya, Tokyo',
      time: '06:14 AM',
      date: '2025-06-15',
      day: 1,
      tags: ['sunrise', 'shibuya'],
      photos: [],
      likes: 0,
      liked: false
    },
    {
      id: 2,
      type: 'food',
      text: 'Found this tiny ramen shop tucked behind a vending machine. 11-seat counter, no English menu. I just pointed. The best bowl I have ever had.',
      mood: '😊',
      location: 'Shinjuku, Tokyo',
      time: '12:38 PM',
      date: '2025-06-15',
      day: 1,
      tags: ['ramen', 'food', 'hidden gem'],
      photos: [],
      likes: 2,
      liked: false
    },
    {
      id: 3,
      type: 'expense',
      text: 'Sumo match tickets — totally worth every yen.',
      mood: '😌',
      location: 'Ryogoku, Tokyo',
      time: '03:22 PM',
      date: '2025-06-15',
      day: 1,
      tags: ['sumo', 'experience'],
      photos: [],
      amount: 3800,
      currency: '₹',
      category: 'Entertainment',
      likes: 0,
      liked: false
    },
    {
      id: 4,
      type: 'note',
      text: 'Discovered that Tokyo convenience stores are actually magical. Had a full gourmet lunch for ₹180. Life is different here.',
      mood: '🤩',
      location: 'Asakusa, Tokyo',
      time: '10:05 AM',
      date: '2025-06-16',
      day: 2,
      tags: ['tip', 'food'],
      photos: [],
      likes: 1,
      liked: false
    }
  ];
  entries = samples;
  localStorage.setItem('yaply_diary', JSON.stringify(entries));
  renderTimeline();
  updateHeroStats();
  updateExpenseSummary();
}

// ── DATE ─────────────────────────────────────────────
function setComposerDate() {
  var now = new Date();
  var opts = { weekday:'long', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' };
  document.getElementById('composerDate').textContent = now.toLocaleDateString('en-US', opts);
}

function getDayNumber(dateStr) {
  var d    = new Date(dateStr);
  var diff = Math.floor((d - tripStart) / 86400000);
  return Math.max(1, diff + 1);
}

function formatTime() {
  return new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
}

function formatDate() {
  return new Date().toISOString().split('T')[0];
}

// ── MOOD ─────────────────────────────────────────────
function setMood(el, mood) {
  document.querySelectorAll('.mood-pill').forEach(function(p) { p.classList.remove('active'); });
  el.classList.add('active');
  currentMood = mood;
}

// ── TYPE ─────────────────────────────────────────────
function setType(el, type) {
  document.querySelectorAll('.type-btn').forEach(function(b) { b.classList.remove('active'); });
  el.classList.add('active');
  currentType = type;
  var expInput = document.getElementById('expenseAmount');
  expInput.style.display = type === 'expense' ? 'block' : 'none';
  var placeholders = {
    note:    'What happened today? A moment, a meal, a feeling…',
    food:    'What did you eat? How was it? Where exactly?',
    expense: 'What did you spend on?',
    place:   'Describe this place. What makes it special?',
    memory:  'A moment you never want to forget…'
  };
  document.getElementById('entryText').placeholder = placeholders[type] || placeholders.note;
}

// ── PHOTOS ───────────────────────────────────────────
function handlePhotos(input) {
  var files = Array.from(input.files);
  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      pendingPhotos.push(e.target.result);
      renderPhotoPreview();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function renderPhotoPreview() {
  var wrap = document.getElementById('photoPreview');
  wrap.innerHTML = pendingPhotos.map(function(src, i) {
    return '<div class="attach-preview">' +
      '<img src="' + src + '" alt="photo"/>' +
      '<button class="attach-remove" onclick="removePhoto(' + i + ')">✕</button>' +
    '</div>';
  }).join('');
}

function removePhoto(i) {
  pendingPhotos.splice(i, 1);
  renderPhotoPreview();
}

// ── LOCATION ─────────────────────────────────────────
var locations = [
  { name: 'Shibuya Crossing', sub: 'Shibuya, Tokyo', icon: '🚦' },
  { name: 'Senso-ji Temple',  sub: 'Asakusa, Tokyo',  icon: '⛩️' },
  { name: 'Shinjuku Station', sub: 'Shinjuku, Tokyo',  icon: '🚉' },
  { name: 'Tsukiji Market',   sub: 'Chuo, Tokyo',      icon: '🐟' },
  { name: 'Harajuku',         sub: 'Shibuya, Tokyo',   icon: '🛍️' },
  { name: 'Akihabara',        sub: 'Chiyoda, Tokyo',   icon: '⚡' },
  { name: 'Roppongi Hills',   sub: 'Minato, Tokyo',    icon: '🏙️' },
  { name: 'Custom location',  sub: 'Enter manually',   icon: '📝' },
];

function openLocationModal() {
  var list = document.getElementById('locationList');
  list.innerHTML = locations.map(function(l) {
    return '<div class="location-item" onclick="selectLocation(\'' + l.name + '\',\'' + l.sub + '\')">' +
      '<span class="location-icon">' + l.icon + '</span>' +
      '<div><div class="location-name">' + l.name + '</div><div class="location-sub">' + l.sub + '</div></div>' +
    '</div>';
  }).join('');
  document.getElementById('locationModal').classList.add('show');
}

function closeLocationModal(e) {
  if (e.target === document.getElementById('locationModal')) {
    document.getElementById('locationModal').classList.remove('show');
  }
}

function selectLocation(name, sub) {
  currentLoc = name;
  document.getElementById('selectedLocation').textContent = name;
  document.getElementById('locationModal').classList.remove('show');
}

// ── SAVE ENTRY ────────────────────────────────────────
function saveEntry() {
  var text = document.getElementById('entryText').value.trim();
  var amount = parseFloat(document.getElementById('expenseAmount').value) || 0;

  if (!text && currentType !== 'expense') {
    shakeComposer();
    return;
  }
  if (currentType === 'expense' && !amount) {
    shakeComposer();
    showToast('Enter an amount for expense');
    return;
  }

  var entry = {
    id:       Date.now(),
    type:     currentType,
    text:     text,
    mood:     currentMood,
    location: currentLoc,
    time:     formatTime(),
    date:     formatDate(),
    day:      getDayNumber(formatDate()),
    tags:     [],
    photos:   pendingPhotos.slice(),
    likes:    0,
    liked:    false
  };

  if (currentType === 'expense') {
    entry.amount   = amount;
    entry.currency = '₹';
    entry.category = getCategoryFromText(text);
  }

  entries.unshift(entry);
  localStorage.setItem('yaply_diary', JSON.stringify(entries));

  // Reset composer
  document.getElementById('entryText').value = '';
  document.getElementById('entryText').style.height = '';
  document.getElementById('expenseAmount').value = '';
  pendingPhotos = [];
  currentLoc = '';
  document.getElementById('selectedLocation').textContent = 'Add location';
  renderPhotoPreview();

  renderTimeline();
  updateHeroStats();
  updateExpenseSummary();

  showToast('Entry saved ✓');
  document.getElementById('emptyState') && (document.getElementById('emptyState').style.display = 'none');
}

function getCategoryFromText(text) {
  var t = text.toLowerCase();
  if (/food|eat|lunch|dinner|breakfast|coffee|drink|ramen|sushi/.test(t)) return 'Food';
  if (/taxi|uber|train|bus|metro|transport|flight/.test(t)) return 'Transport';
  if (/hotel|hostel|stay|accommodation/.test(t)) return 'Stay';
  if (/shop|buy|souvenir|market|mall/.test(t)) return 'Shopping';
  return 'Entertainment';
}

function shakeComposer() {
  var c = document.getElementById('composer');
  c.style.animation = 'none';
  c.offsetHeight;
  c.style.animation = 'shake .35s ease';
  setTimeout(function() { c.style.animation = ''; }, 350);
}

// ── RENDER TIMELINE ───────────────────────────────────
function renderTimeline() {
  var timeline = document.getElementById('timeline');
  var empty    = document.getElementById('emptyState');

  var filtered = entries.filter(function(e) {
    var typeMatch   = activeFilter === 'all' || e.type === activeFilter;
    var searchMatch = !searchQuery || e.text.toLowerCase().includes(searchQuery) || (e.location || '').toLowerCase().includes(searchQuery);
    return typeMatch && searchMatch;
  });

  if (filtered.length === 0) {
    timeline.innerHTML = '<div class="empty-state"><span class="empty-icon">📖</span><div class="empty-title">Your diary awaits.</div><div class="empty-sub">Start writing your first entry above.<br/>Every moment worth remembering.</div></div>';
    return;
  }

  // Group by date
  var groups = {};
  filtered.forEach(function(e) {
    if (!groups[e.date]) groups[e.date] = [];
    groups[e.date].push(e);
  });

  var dates = Object.keys(groups).sort(function(a,b) { return new Date(b) - new Date(a); });

  timeline.innerHTML = dates.map(function(date, di) {
    var dayEntries = groups[date];
    var dayNum     = getDayNumber(date);
    var dateLabel  = new Date(date).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

    var entriesHtml = dayEntries.map(function(e, ei) {
      return buildEntryCard(e, (di * 10 + ei) * 50);
    }).join('');

    return '<div class="day-group">' +
      '<div class="day-label">' +
        '<div class="day-circle">D' + dayNum + '</div>' +
        '<div>' +
          '<div class="day-text">' + dateLabel + '</div>' +
          '<div class="day-sub">' + dayEntries.length + ' entr' + (dayEntries.length === 1 ? 'y' : 'ies') + '</div>' +
        '</div>' +
      '</div>' +
      entriesHtml +
    '</div>';
  }).join('');
}

function buildEntryCard(e, delay) {
  var typeConfig = {
    note:    { icon: '📝', label: 'Note',    stripeClass: 'stripe-note',    iconClass: 'icon-note' },
    food:    { icon: '🍜', label: 'Food',    stripeClass: 'stripe-food',    iconClass: 'icon-food' },
    expense: { icon: '💰', label: 'Expense', stripeClass: 'stripe-expense', iconClass: 'icon-expense' },
    place:   { icon: '📍', label: 'Place',   stripeClass: 'stripe-place',   iconClass: 'icon-place' },
    memory:  { icon: '✨', label: 'Memory',  stripeClass: 'stripe-memory',  iconClass: 'icon-memory' },
  };
  var cfg = typeConfig[e.type] || typeConfig.note;

  // Photo grid
  var photoHtml = '';
  if (e.photos && e.photos.length > 0) {
    var gridClass = e.photos.length === 1 ? 'grid-1' : e.photos.length === 2 ? 'grid-2' : 'grid-3';
    photoHtml = '<div class="photo-grid ' + gridClass + '">' +
      e.photos.slice(0,3).map(function(src) {
        return '<div class="photo-item"><img src="' + src + '" alt="photo"/></div>';
      }).join('') +
    '</div>';
  }

  // Expense display
  var expenseHtml = '';
  if (e.type === 'expense' && e.amount) {
    expenseHtml = '<div class="expense-display">' +
      '<div>' +
        '<div class="expense-category">' + (e.category || 'Expense') + '</div>' +
        '<div class="expense-currency">' + (e.currency || '₹') + '</div>' +
      '</div>' +
      '<div class="expense-amount">' + (e.currency || '₹') + ' ' + (e.amount || 0).toLocaleString() + '</div>' +
    '</div>';
  }

  // Tags
  var tagsHtml = '';
  if (e.tags && e.tags.length) {
    tagsHtml = '<div class="entry-tags">' +
      e.tags.map(function(t) { return '<span class="entry-tag ' + (e.type || 'note') + '">' + t + '</span>'; }).join('') +
    '</div>';
  }

  return '<div class="entry-card" style="animation-delay:' + delay + 'ms">' +
    '<div class="entry-stripe ' + cfg.stripeClass + '"></div>' +
    '<div class="entry-header">' +
      '<div class="entry-type-icon ' + cfg.iconClass + '">' + cfg.icon + '</div>' +
      '<div class="entry-meta">' +
        '<div class="entry-time">' + e.time + (e.mood ? ' &nbsp;&bull;&nbsp; ' + e.mood : '') + '</div>' +
        (e.location ? '<div class="entry-location-tag"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + e.location + '</div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="entry-content">' +
      (e.text ? '<div class="entry-text">' + e.text + '</div>' : '') +
      expenseHtml +
      photoHtml +
      tagsHtml +
    '</div>' +
    '<div class="entry-actions">' +
      '<button class="entry-action-btn ' + (e.liked ? 'liked' : '') + '" onclick="toggleLike(' + e.id + ')">' +
        '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' +
        (e.likes > 0 ? e.likes : '') +
      '</button>' +
      '<button class="entry-action-btn" onclick="copyEntry(' + e.id + ')">' +
        '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
        'Copy' +
      '</button>' +
      '<button class="entry-action-btn" onclick="deleteEntry(' + e.id + ')" style="color:var(--coral)">' +
        '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
        'Delete' +
      '</button>' +
    '</div>' +
  '</div>';
}

// ── ACTIONS ───────────────────────────────────────────
function toggleLike(id) {
  entries = entries.map(function(e) {
    if (e.id === id) {
      e.liked = !e.liked;
      e.likes = e.liked ? e.likes + 1 : Math.max(0, e.likes - 1);
    }
    return e;
  });
  localStorage.setItem('yaply_diary', JSON.stringify(entries));
  renderTimeline();
}

function copyEntry(id) {
  var e = entries.find(function(e) { return e.id === id; });
  if (e && navigator.clipboard) {
    navigator.clipboard.writeText(e.text);
    showToast('Copied to clipboard');
  }
}

function deleteEntry(id) {
  entries = entries.filter(function(e) { return e.id !== id; });
  localStorage.setItem('yaply_diary', JSON.stringify(entries));
  renderTimeline();
  updateHeroStats();
  updateExpenseSummary();
  showToast('Entry deleted');
}

// ── FILTER + SEARCH ───────────────────────────────────
function filterEntries(el, filter) {
  document.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
  el.classList.add('active');
  activeFilter = filter;
  renderTimeline();
}

function searchEntries(query) {
  searchQuery = query.toLowerCase();
  renderTimeline();
}

// ── HERO STATS ────────────────────────────────────────
function updateHeroStats() {
  document.getElementById('heroEntries').textContent = entries.length;
  var today   = new Date();
  var dayNum  = Math.max(1, Math.floor((today - tripStart) / 86400000) + 1);
  document.getElementById('heroDay').textContent = 'Day ' + dayNum;

  var totalSpent = entries
    .filter(function(e) { return e.type === 'expense' && e.amount; })
    .reduce(function(sum, e) { return sum + e.amount; }, 0);
  document.getElementById('heroSpent').textContent = '₹' + totalSpent.toLocaleString();
}

// ── EXPENSE SUMMARY ───────────────────────────────────
function updateExpenseSummary() {
  var expenseEntries = entries.filter(function(e) { return e.type === 'expense' && e.amount; });

  if (expenseEntries.length === 0) {
    document.getElementById('expenseSummary').style.display = 'none';
    return;
  }

  document.getElementById('expenseSummary').style.display = 'block';

  var total = expenseEntries.reduce(function(s, e) { return s + e.amount; }, 0);
  document.getElementById('expTotal').textContent = '₹' + total.toLocaleString();

  var categories = {};
  expenseEntries.forEach(function(e) {
    var cat = e.category || 'Other';
    categories[cat] = (categories[cat] || 0) + e.amount;
  });

  var catColors = {
    'Food': '#E8673A', 'Transport': '#3A6BC8', 'Stay': '#1A8A72',
    'Shopping': '#C49A3C', 'Entertainment': '#8B5CF6', 'Other': '#7A776E'
  };
  var catIcons = {
    'Food': '🍜', 'Transport': '🚌', 'Stay': '🏨',
    'Shopping': '🛍️', 'Entertainment': '🎭', 'Other': '💼'
  };

  document.getElementById('expCategories').innerHTML = Object.entries(categories)
    .sort(function(a,b) { return b[1] - a[1]; })
    .map(function(entry) {
      var cat = entry[0], amt = entry[1];
      var pct = Math.round(amt / total * 100);
      var col = catColors[cat] || '#7A776E';
      return '<div class="exp-cat-row">' +
        '<span class="exp-cat-icon">' + (catIcons[cat] || '💼') + '</span>' +
        '<span class="exp-cat-name">' + cat + '</span>' +
        '<div class="exp-cat-bar-wrap"><div class="exp-cat-bar" style="width:' + pct + '%;background:' + col + ';"></div></div>' +
        '<span class="exp-cat-amt">₹' + amt.toLocaleString() + '</span>' +
      '</div>';
    }).join('');
}

// ── CONFIG ────────────────────────────────────────────────
var API_BASE  = '';  // empty = same domain (yaply.live)
var AUTH_TOKEN = localStorage.getItem('yaply_token') || '';
var CURRENT_TRIP_ID = null;  // set after loading or creating trip

// ── API HELPER ────────────────────────────────────────────
async function diaryAPI(method, path, body) {
  try {
    var options = {
      method:  method,
      headers: {
        'Content-Type':  'application/json',
        'Authorization': 'Bearer ' + AUTH_TOKEN
      }
    };
    if (body && method !== 'GET') {
      options.body = JSON.stringify(body);
    }
    var url = API_BASE + path;
    if (body && method === 'GET') {
      var params = new URLSearchParams(body);
      url += '?' + params.toString();
    }
    var res = await fetch(url, options);
    return await res.json();
  } catch(e) {
    console.error('[Diary API]', path, e);
    return { success: false, error: 'Network error' };
  }
}

// ── INIT ──────────────────────────────────────────────────
window.addEventListener('load', async function() {
  setComposerDate();
  await loadOrCreateTrip();
  await loadEntries();
  await updateHeroStats();
  await updateExpenseSummary();
});

// ── TRIP MANAGEMENT ───────────────────────────────────────
async function loadOrCreateTrip() {
  // Check URL for trip_id
  var params  = new URLSearchParams(window.location.search);
  var tripId  = params.get('trip_id');
  var tripDest = params.get('dest') || 'My Trip';

  if (tripId) {
    CURRENT_TRIP_ID = parseInt(tripId);
    var res = await diaryAPI('GET', '/api/diary/trips/' + tripId);
    if (res.success) {
      document.getElementById('heroDest').textContent = res.trip.destination;
      tripDest = res.trip.destination;
    }
    return;
  }

  // Load existing trips
  var tripsRes = await diaryAPI('GET', '/api/diary/trips');
  if (tripsRes.success && tripsRes.trips.length > 0) {
    // Use the most recent active trip
    CURRENT_TRIP_ID = tripsRes.trips[0].id;
    document.getElementById('heroDest').textContent = tripsRes.trips[0].destination;
    return;
  }

  // No trip yet — auto-create from URL or defaults
  var createRes = await diaryAPI('POST', '/api/diary/trips', {
    destination: tripDest,
    currency:    'INR'
  });

  if (createRes.success) {
    CURRENT_TRIP_ID = createRes.trip_id;
    document.getElementById('heroDest').textContent = tripDest;
  }
}

// ── LOAD ENTRIES ──────────────────────────────────────────
async function loadEntries(filter, search) {
  var params = { limit: 100 };
  if (CURRENT_TRIP_ID) params.trip_id = CURRENT_TRIP_ID;
  if (filter && filter !== 'all') params.type = filter;
  if (search) params.search = search;

  var res = await diaryAPI('GET', '/api/diary/entries', params);

  if (res.success) {
    entries = res.entries;
    renderTimeline();
  } else {
    showToast('Could not load entries');
  }
}

// ── SAVE ENTRY ────────────────────────────────────────────
async function saveEntry() {
  var text   = document.getElementById('entryText').value.trim();
  var amount = parseFloat(document.getElementById('expenseAmount').value) || 0;

  if (!text && currentType !== 'expense') {
    shakeComposer();
    return;
  }
  if (currentType === 'expense' && !amount) {
    shakeComposer();
    showToast('Enter an amount');
    return;
  }

  var btn = document.querySelector('.save-entry-btn');
  btn.disabled = true;
  btn.innerHTML = '⏳ Saving...';

  var payload = {
    trip_id:    CURRENT_TRIP_ID,
    type:       currentType,
    text:       text,
    mood:       currentMood,
    location:   currentLoc,
    tags:       [],
    photos:     pendingPhotos.slice(),
    day_number: getDayNumber(new Date().toISOString().split('T')[0])
  };

  if (currentType === 'expense') {
    payload.amount   = amount;
    payload.currency = '₹';
  }

  var res = await diaryAPI('POST', '/api/diary/entries', payload);

  if (res.success) {
    // Reset composer
    document.getElementById('entryText').value = '';
    document.getElementById('entryText').style.height = '';
    document.getElementById('expenseAmount').value = '';
    pendingPhotos = [];
    currentLoc    = '';
    document.getElementById('selectedLocation').textContent = 'Add location';
    renderPhotoPreview();

    // Prepend to local entries array and re-render
    entries.unshift(res.entry);
    renderTimeline();
    await updateHeroStats();
    if (currentType === 'expense') await updateExpenseSummary();

    showToast('Entry saved ✓');
  } else {
    showToast('Could not save entry: ' + (res.error || ''));
  }

  btn.disabled = false;
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Save';
}

// ── DELETE ENTRY ──────────────────────────────────────────
async function deleteEntry(id) {
  var res = await diaryAPI('DELETE', '/api/diary/entries/' + id);
  if (res.success) {
    entries = entries.filter(function(e) { return e.id !== id; });
    renderTimeline();
    await updateHeroStats();
    await updateExpenseSummary();
    showToast('Entry deleted');
  } else {
    showToast('Could not delete entry');
  }
}

// ── TOGGLE LIKE / FAVORITE ────────────────────────────────
async function toggleLike(id) {
  var res = await diaryAPI('POST', '/api/diary/entries/' + id + '/favorite');
  if (res.success) {
    entries = entries.map(function(e) {
      if (e.id === id) {
        e.is_favorite = res.is_favorite ? 1 : 0;
        e.liked       = res.is_favorite;
        e.likes       = res.is_favorite ? (e.likes || 0) + 1 : Math.max(0, (e.likes || 0) - 1);
      }
      return e;
    });
    renderTimeline();
  }
}

// ── HERO STATS ────────────────────────────────────────────
async function updateHeroStats() {
  var res = await diaryAPI('GET', '/api/diary/stats', CURRENT_TRIP_ID ? { trip_id: CURRENT_TRIP_ID } : {});
  if (res.success) {
    document.getElementById('heroEntries').textContent = res.total_entries || 0;

    var today  = new Date();
    var dayNum = Math.max(1, res.days_logged || 1);
    document.getElementById('heroDay').textContent = 'Day ' + dayNum;

    var spent = res.total_spent || 0;
    document.getElementById('heroSpent').textContent = '₹' + spent.toLocaleString();
  }
}

// ── EXPENSE SUMMARY ───────────────────────────────────────
async function updateExpenseSummary() {
  var params = CURRENT_TRIP_ID ? { trip_id: CURRENT_TRIP_ID } : {};
  var res    = await diaryAPI('GET', '/api/diary/expenses', params);

  if (!res.success || res.total === 0) {
    document.getElementById('expenseSummary').style.display = 'none';
    return;
  }

  document.getElementById('expenseSummary').style.display = 'block';
  document.getElementById('expTotal').textContent = '₹' + res.total.toLocaleString();

  var CAT_COLORS = {
    'Food': '#E8673A', 'Transport': '#3A6BC8', 'Stay': '#1A8A72',
    'Shopping': '#C49A3C', 'Entertainment': '#8B5CF6', 'Other': '#7A776E'
  };
  var CAT_ICONS = {
    'Food': '🍜', 'Transport': '🚌', 'Stay': '🏨',
    'Shopping': '🛍️', 'Entertainment': '🎭', 'Other': '💼'
  };

  document.getElementById('expCategories').innerHTML = (res.by_category || [])
    .map(function(cat) {
      var pct = Math.round((cat.total / res.total) * 100);
      var col = CAT_COLORS[cat.category] || '#7A776E';
      return '<div class="exp-cat-row">' +
        '<span class="exp-cat-icon">' + (CAT_ICONS[cat.category] || '💼') + '</span>' +
        '<span class="exp-cat-name">' + cat.category + '</span>' +
        '<div class="exp-cat-bar-wrap"><div class="exp-cat-bar" style="width:' + pct + '%;background:' + col + '"></div></div>' +
        '<span class="exp-cat-amt">₹' + Math.round(cat.total).toLocaleString() + '</span>' +
      '</div>';
    }).join('');
}

// ── FILTER & SEARCH ───────────────────────────────────────
function filterEntries(el, filter) {
  document.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
  el.classList.add('active');
  activeFilter = filter;
  loadEntries(filter === 'all' ? null : filter, searchQuery || null);
}

function searchEntries(query) {
  searchQuery = query.toLowerCase();
  clearTimeout(window._searchTimer);
  window._searchTimer = setTimeout(function() {
    loadEntries(activeFilter === 'all' ? null : activeFilter, searchQuery || null);
  }, 350);
}

// ── EXPORT ────────────────────────────────────────────────
async function openExportModal() {
  var url = '/api/diary/export?format=text';
  if (CURRENT_TRIP_ID) url += '&trip_id=' + CURRENT_TRIP_ID;
  url += '&token=' + AUTH_TOKEN;
  window.open(url, '_blank');
  showToast('Diary exported!');
}

// ── AI JOURNAL ────────────────────────────────────────────
async function generateAIJournal() {
  if (!entries.length) {
    showToast('Write some entries first!');
    return;
  }

  showToast('✨ Generating your travel story...');

  var res = await diaryAPI('POST', '/api/diary/ai-journal', {
    trip_id: CURRENT_TRIP_ID,
    style:   'storytelling'
  });

  if (res.success) {
    showAIJournal(res.journal);
  } else {
    showToast('Could not generate journal: ' + (res.error || ''));
  }
}

function showAIJournal(journal) {

      '</div>' +
      '<div style="font-family:Lora,serif;font-style:italic;font-size:14px;line-height:1.8;color:var(--ink2);">' +
        ch.story +
      '</div>' +
      '<div style="margin-top:8px;padding:8px 12px;background:var(--teal-l);border-radius:8px;font-size:12px;color:var(--teal);">' +
        '✨ ' + ch.highlight +
      '</div>' +
    '</div>';
  }).join('');

  var html =
    '<div class="modal-overlay show" id="journalModal" onclick="if(event.target===this)this.remove()">' +
    '<div class="modal-sheet" style="max-height:90vh;">' +
      '<div class="modal-handle"></div>' +
      '<div style="font-family:Lora,serif;font-style:italic;font-size:22px;font-weight:600;color:var(--ink);margin-bottom:4px;">' +
        journal.title +
      '</div>' +
      '<div style="font-size:13px;color:var(--ink3);margin-bottom:20px;">' + journal.tagline + '</div>' +
      chaptersHtml +
      '<div style="background:var(--paper2);border-radius:12px;padding:14px;margin-top:16px;">' +
        '<div style="font-size:11px;font-weight:700;color:var(--teal);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;">Closing Thoughts</div>' +
        '<div style="font-family:Lora,serif;font-style:italic;font-size:13px;line-height:1.7;">' + journal.closing + '</div>' +
      '</div>' +
      '<div style="margin-top:12px;text-align:center;font-size:12px;color:var(--ink3);font-style:italic;">"' + journal.quote + '"</div>' +
      '<button onclick="document.getElementById(\'journalModal\').remove()" style="width:100%;margin-top:16px;padding:12px;background:var(--teal);color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;">Close</button>' +
    '</div></div>';

  document.body.insertAdjacentHTML('beforeend', html);
}
